<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITQ Plane Spotter - Düsseldorf Airport</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .location-info {
            font-size: 1.1em;
            opacity: 0.9;
            margin-top: 10px;
        }

        .status {
            text-align: center;
            padding: 15px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 1.1em;
        }

        .loading {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .flights-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .flight-row {
            background: rgba(255, 255, 255, 0.95);
            color: #1e3c72;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: slideIn 0.3s ease;
            display: grid;
            grid-template-columns: 80px 1fr auto;
            gap: 20px;
            align-items: center;
        }

        .flight-row:hover {
            transform: translateX(5px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.2);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .flight-row.arriving {
            border-left: 4px solid #22c55e;
        }

        .flight-row.departing {
            border-left: 4px solid #f59e0b;
        }

        .flight-photo {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
        }

        .flight-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .flight-number {
            font-size: 1.4em;
            font-weight: bold;
            color: #1e3c72;
        }

        .flight-airline {
            font-size: 0.95em;
            color: #64748b;
        }

        .flight-route {
            font-size: 1.1em;
            color: #1e3c72;
            font-weight: 500;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .status-badge.arriving {
            background: #22c55e;
            color: white;
        }

        .status-badge.departing {
            background: #f59e0b;
            color: white;
        }

        .footer {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 30px;
        }

        .last-update {
            font-size: 0.95em;
            opacity: 0.8;
        }

        .no-flights {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            font-size: 1.3em;
        }

        .plane-icon {
            font-size: 3em;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .flight-row {
                grid-template-columns: 60px 1fr;
                gap: 15px;
                padding: 15px;
            }

            .flight-photo {
                width: 60px;
                height: 45px;
            }

            .flight-number {
                font-size: 1.2em;
            }

            .flight-route {
                font-size: 1em;
            }

            .status-badge {
                grid-column: 1 / -1;
                justify-self: start;
                margin-top: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✈️ ITQ Plane Spotter</h1>
        </header>

        <div class="flights-container" id="flights-container">
        </div>

        <div class="footer">
            <div class="last-update" id="last-update">Waiting for data...</div>
            <div style="margin-top: 10px; opacity: 0.7; font-size: 0.9em;">
                Live flight data from Düsseldorf Airport (updates every minute)
            </div>
        </div>
    </div>

    <script>
        // Düsseldorf Airport coordinates
        const DUS_LAT = 51.2850;  // Same height as office
        const DUS_LON = 6.7568;

        // Your office coordinates (Wanheimer Str. 43, 40472 Düsseldorf)
        const OFFICE_LAT = 51.2850;  // Same height as airport
        const OFFICE_LON = 6.7891;

        // Viewing angle from office (looking north: 315° to 45° = NW to NE)
        const VIEW_BEARING_MIN = 315;
        const VIEW_BEARING_MAX = 45;

        // Runway orientation (EDDL runways: 05L/23R and 05R/23L)
        // Runway 05 = northeast departure (heading ~050°)
        // Runway 23 = southwest landing (approaching from NE, heading ~230° on final)
        const RUNWAY_NE_HEADING = 50; // Runway 05 departure heading
        const RUNWAY_SW_HEADING = 230; // Runway 23 approach heading

        let lastUpdate = null;
        let lastFlightsData = []; // Cache last successful flight data
        let flightDetailsCache = {}; // Cache for enriched flight details
        let lastDetailsFetch = 0; // Track when we last fetched details
        let dusArrivals = []; // Store DUS arrivals separately for time-based matching
        let dusDepartures = []; // Store DUS departures separately for time-based matching
        let activeRunways = { arrivals: [], departures: [] }; // Current runway configuration from ATIS
        let lastATISFetch = 0; // Track when we last fetched ATIS

        // Get country flag emoji
        function getCountryFlag(countryName) {
            const countryFlags = {
                'Germany': '🇩🇪', 'France': '🇫🇷', 'Spain': '🇪🇸', 'Italy': '🇮🇹',
                'United Kingdom': '🇬🇧', 'Netherlands': '🇳🇱', 'Belgium': '🇧🇪',
                'Switzerland': '🇨🇭', 'Austria': '🇦🇹', 'Portugal': '🇵🇹',
                'Greece': '🇬🇷', 'Poland': '🇵🇱', 'Turkey': '🇹🇷', 'Türkiye': '🇹🇷',
                'United States': '🇺🇸', 'Canada': '🇨🇦',
                'United Arab Emirates': '🇦🇪', 'Qatar': '🇶🇦', 'Saudi Arabia': '🇸🇦',
                'Egypt': '🇪🇬', 'Morocco': '🇲🇦', 'Tunisia': '🇹🇳', 'Algeria': '🇩🇿',
                'Israel': '🇮🇱', 'Lebanon': '🇱🇧', 'Jordan': '🇯🇴',
                'India': '🇮🇳', 'China': '🇨🇳', 'Japan': '🇯🇵', 'South Korea': '🇰🇷',
                'Singapore': '🇸🇬', 'Thailand': '🇹🇭', 'Malaysia': '🇲🇾', 'Indonesia': '🇮🇩',
                'Russia': '🇷🇺', 'Ukraine': '🇺🇦', 'Sweden': '🇸🇪', 'Norway': '🇳🇴',
                'Denmark': '🇩🇰', 'Finland': '🇫🇮', 'Ireland': '🇮🇪',
                'Czech Republic': '🇨🇿', 'Hungary': '🇭🇺', 'Romania': '🇷🇴',
                'Bulgaria': '🇧🇬', 'Croatia': '🇭🇷', 'Serbia': '🇷🇸',
                'Slovenia': '🇸🇮', 'Slovakia': '🇸🇰', 'Lithuania': '🇱🇹',
                'Latvia': '🇱🇻', 'Estonia': '🇪🇪', 'Iceland': '🇮🇸',
                'Luxembourg': '🇱🇺', 'Malta': '🇲🇹', 'Cyprus': '🇨🇾',
                'Brazil': '🇧🇷', 'Argentina': '🇦🇷', 'Mexico': '🇲🇽',
                'Chile': '🇨🇱', 'Colombia': '🇨🇴', 'Peru': '🇵🇪',
                'Australia': '🇦🇺', 'New Zealand': '🇳🇿',
                'South Africa': '🇿🇦', 'Kenya': '🇰🇪', 'Ethiopia': '🇪🇹', 'Nigeria': '🇳🇬'
            };
            return countryFlags[countryName] || '🌍';
        }

        // Extract country name from "City, Country" format
        function extractCountryFromLocation(location) {
            if (!location) return '';
            const parts = location.split(',');
            if (parts.length >= 2) {
                return parts[parts.length - 1].trim();
            }
            return '';
        }

        // Fetch aircraft photo from Planespotters API
        async function fetchAircraftPhoto(registration) {
            if (!registration) return null;
            try {
                // Use CORS proxy for Planespotters API
                const proxyUrl = 'https://corsproxy.io/?';
                const apiUrl = `https://api.planespotters.net/pub/photos/reg/${registration}`;
                const url = proxyUrl + encodeURIComponent(apiUrl);

                console.log(`Fetching photo for ${registration}`);
                const response = await fetch(url);
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.photos && data.photos.length > 0) {
                        const photoUrl = data.photos[0].thumbnail_large?.src || data.photos[0].thumbnail?.src;
                        console.log(`Found photo for ${registration}: ${photoUrl}`);
                        return photoUrl;
                    }
                }
                console.log(`No photo found for ${registration}`);
                return null;
            } catch (error) {
                console.error(`Error fetching aircraft photo for ${registration}:`, error);
                return null;
            }
        }

        // Calculate distance between two points (Haversine formula)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                     Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                     Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Calculate bearing from office to plane
        function calculateBearing(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                     Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
            const bearing = Math.atan2(y, x) * 180 / Math.PI;
            return (bearing + 360) % 360;
        }

        // Get direction from bearing
        function getDirection(bearing) {
            const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
            const index = Math.round(bearing / 22.5) % 16;
            return directions[index];
        }

        // Check if bearing is within viewing angle (looking north)
        function isInViewingAngle(bearing) {
            // North view: 315° to 45° (wraps around 0°/360°)
            if (VIEW_BEARING_MIN > VIEW_BEARING_MAX) {
                return bearing >= VIEW_BEARING_MIN || bearing <= VIEW_BEARING_MAX;
            }
            return bearing >= VIEW_BEARING_MIN && bearing <= VIEW_BEARING_MAX;
        }

        // Check if plane is using northeast runway operations (visible from office)
        function isUsingNortheastRunway(heading, altitude, verticalRate, distanceToAirport) {
            // Only consider planes near the airport (within 10km and below 5000m)
            if (distanceToAirport > 10 || altitude > 5000) {
                return false;
            }

            // Normalize heading
            const normalizedHeading = ((heading % 360) + 360) % 360;

            // Departing on runway 05 (heading northeast: 010-100° - wider range)
            const isDepartingNE = (normalizedHeading >= 10 && normalizedHeading <= 100) &&
                                  verticalRate >= -2 && altitude < 3500;

            // Arriving on runway 23 (approaching from NE, heading ~190-270° - wider range)
            const isArrivingFromNE = (normalizedHeading >= 190 && normalizedHeading <= 270) &&
                                     verticalRate <= 2 && altitude < 3500;

            return isDepartingNE || isArrivingFromNE;
        }

        // Determine flight status based on vertical rate and heading
        function determineFlightStatus(heading, altitude, verticalRate, distanceToAirport) {
            const normalizedHeading = ((heading % 360) + 360) % 360;

            // If heading southwest (on approach), it's arriving
            if (normalizedHeading >= 200 && normalizedHeading <= 260 && verticalRate < 0) {
                return 'arriving';
            }

            // If heading northeast (departing), it's departing
            if (normalizedHeading >= 20 && normalizedHeading <= 80 && verticalRate >= -5) {
                return 'departing';
            }

            // Fallback: use vertical rate
            return verticalRate < -2 ? 'arriving' : 'departing';
        }

        // Format altitude
        function formatAltitude(meters) {
            if (!meters && meters !== 0) return 'N/A';
            const feet = Math.round(meters * 3.28084);
            return `${meters.toFixed(0)}m (${feet}ft)`;
        }

        // Format speed
        function formatSpeed(metersPerSecond) {
            if (!metersPerSecond && metersPerSecond !== 0) return 'N/A';
            const kmh = metersPerSecond * 3.6;
            const knots = metersPerSecond * 1.94384;
            return `${kmh.toFixed(0)} km/h (${knots.toFixed(0)} kt)`;
        }

        // Format vertical rate
        function formatVerticalRate(rate) {
            if (!rate && rate !== 0) return 'Level';
            const fpm = rate * 196.85; // m/s to ft/min
            const direction = rate > 0 ? '↑' : '↓';
            return `${direction} ${Math.abs(fpm).toFixed(0)} ft/min`;
        }


        // Fetch flights from OpenSky Network API (supports CORS)
        async function fetchFlights() {
            try {
                const minLat = DUS_LAT - 0.5;
                const maxLat = DUS_LAT + 0.5;
                const minLon = DUS_LON - 0.7;
                const maxLon = DUS_LON + 0.7;

                const url = `https://opensky-network.org/api/states/all?lamin=${minLat}&lomin=${minLon}&lamax=${maxLat}&lomax=${maxLon}`;

                const response = await fetch(url);
                if (!response.ok) {
                    if (response.status === 429) {
                        throw new Error('RATE_LIMIT');
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                lastUpdate = new Date();

                // Convert OpenSky format to our format
                const flights = [];
                if (data.states) {
                    for (const state of data.states) {
                        // OpenSky format: [icao24, callsign, origin_country, time_position, last_contact,
                        //                  longitude, latitude, baro_altitude, on_ground, velocity,
                        //                  true_track, vertical_rate, sensors, geo_altitude, squawk, sps, position_source]
                        const [icao24, callsign, origin_country, time_position, last_contact,
                               longitude, latitude, baro_altitude, on_ground, velocity,
                               true_track, vertical_rate] = state;

                        // Skip if on ground or missing critical data
                        if (on_ground || !latitude || !longitude || !true_track) continue;

                        flights.push({
                            id: icao24,
                            latitude: latitude,
                            longitude: longitude,
                            heading: true_track,
                            altitude: baro_altitude || 0,
                            speed: velocity || 0,
                            verticalRate: vertical_rate || 0,
                            callsign: callsign ? callsign.trim() : icao24.toUpperCase(),
                            origin: '',
                            destination: '',
                            aircraftType: '',
                            registration: icao24
                        });
                    }
                }

                // Cache successful data
                lastFlightsData = flights;
                console.log(`Fetched ${flights.length} flights from OpenSky Network`);
                return flights;
            } catch (error) {
                console.error('Error fetching flights:', error);

                // If we hit rate limits, use cached data
                if (error.message.includes('429') || error.message === 'RATE_LIMIT') {
                    if (lastFlightsData.length > 0) {
                        console.log('Using cached flight data due to rate limiting');
                        const cacheAge = Math.round((new Date() - lastUpdate) / 1000);
                        document.getElementById('status').innerHTML = `<span style="color: #ffa500;">⚠️ API Rate Limited - Using cached data (${cacheAge}s old)</span>`;
                        return lastFlightsData;
                    } else {
                        document.getElementById('status').innerHTML = `<span style="color: #ff6b6b;">⚠️ API Rate Limited - No cached data available. Retrying in 4 minutes...</span>`;
                        return [];
                    }
                }

                document.getElementById('status').innerHTML = `<span style="color: #ff6b6b;">Error loading flight data. Retrying in 4 minutes...</span>`;
                return lastFlightsData.length > 0 ? lastFlightsData : [];
            }
        }

        // Fetch current runway configuration from ATIS
        async function fetchATIS() {
            try {
                // Use CORS proxy for ATIS.guru
                const proxyUrl = 'https://corsproxy.io/?';
                const atisUrl = 'https://atis.guru/atis/EDDL';

                const response = await fetch(proxyUrl + encodeURIComponent(atisUrl));
                if (!response.ok) {
                    console.warn('ATIS fetch failed, using default runway config');
                    return null;
                }

                const html = await response.text();

                // Parse ATIS to find runway information
                const runwayInfo = {
                    arrivals: [],
                    departures: []
                };

                // Extract arrival ATIS section
                const arrivalMatch = html.match(/Arrival ATIS[\s\S]*?<div class="atis">([\s\S]*?)<\/div>/i);
                if (arrivalMatch) {
                    const arrivalAtis = arrivalMatch[1];
                    // Look for RWY mentions in arrival ATIS
                    const rwyMatch = arrivalAtis.match(/RWY\s*(05[LR]?|23[LR]?)/i);
                    if (rwyMatch) {
                        runwayInfo.arrivals.push(rwyMatch[1].toUpperCase());
                    }
                }

                // Extract departure ATIS section
                const departureMatch = html.match(/Departure ATIS[\s\S]*?<div class="atis">([\s\S]*?)<\/div>/i);
                if (departureMatch) {
                    const departureAtis = departureMatch[1];
                    // Look for RWY mentions in departure ATIS
                    const rwyMatch = departureAtis.match(/RWY\s*(05[LR]?|23[LR]?)/i);
                    if (rwyMatch) {
                        runwayInfo.departures.push(rwyMatch[1].toUpperCase());
                    }
                }

                console.log('ATIS runway config:', runwayInfo);
                return runwayInfo;
            } catch (error) {
                console.error('Error fetching ATIS:', error);
                return null;
            }
        }

        // Check if we should show this flight based on runway configuration
        function isVisibleFromOffice(isArrival) {
            // Office looks north, so we can only see northeast operations (runway 05 departures, runway 23 arrivals)
            const runways = isArrival ? activeRunways.arrivals : activeRunways.departures;

            if (runways.length === 0) {
                // No ATIS data, show all flights
                return true;
            }

            if (isArrival) {
                // Can see arrivals on runway 23 (coming from northeast)
                return runways.some(rwy => rwy.startsWith('23'));
            } else {
                // Can see departures on runway 05 (going northeast)
                return runways.some(rwy => rwy.startsWith('05'));
            }
        }

        // Filter flights by status to show only currently active flights
        function isActiveArrival(flight) {
            const status = flight.status?.publicStatus?.name?.toLowerCase() || '';
            const statusCode = flight.status?.code || '';

            // Exclude only completed/cancelled flights - include everything else
            // This is more robust than whitelisting specific statuses
            const excludedStatuses = ['landed', 'cancelled', 'diverted', 'arrived'];
            return !excludedStatuses.includes(status) && status !== '';
        }

        function isActiveDeparture(flight) {
            const status = flight.status?.publicStatus?.name?.toLowerCase() || '';
            const statusCode = flight.status?.code || '';

            // Exclude flights that have already departed or are cancelled
            // This is more robust than whitelisting specific statuses
            const excludedStatuses = ['departed', 'airborne', 'cancelled', 'diverted'];
            return !excludedStatuses.includes(status) && status !== '';
        }

        // Determine what type of flights to fetch based on runway config
        function shouldFetchArrivals() {
            // If no ATIS data, fetch both
            if (activeRunways.arrivals.length === 0 && activeRunways.departures.length === 0) {
                return true;
            }
            // Check if arrivals use runway 23 (visible from office)
            return activeRunways.arrivals.some(rwy => rwy.startsWith('23'));
        }

        function shouldFetchDepartures() {
            // If no ATIS data, fetch both
            if (activeRunways.arrivals.length === 0 && activeRunways.departures.length === 0) {
                return true;
            }
            // Check if departures use runway 05 (visible from office)
            return activeRunways.departures.some(rwy => rwy.startsWith('05'));
        }

        // Fetch flights from Düsseldorf Airport (optimized based on runway)
        async function fetchDUSFlights() {
            try {
                // DUS Airport API URLs
                const arrivalUrl = 'https://www.dus.com/api/sitecore/flightapi/SearchFlightsWithOutParams?lang=en&arrival=true&offset=0&codeshare=true&showDetails=false';
                const departureUrl = 'https://www.dus.com/api/sitecore/flightapi/SearchFlightsWithOutParams?lang=en&arrival=false&offset=0&codeshare=true&showDetails=false';

                console.log('Fetching DUS Airport data via CORS proxy...');
                console.log('Runway config - Fetch arrivals:', shouldFetchArrivals(), ', Fetch departures:', shouldFetchDepartures());

                // Try corsproxy.io which should forward headers
                const proxyUrl = 'https://corsproxy.io/?';

                // Fetch arrivals only if visible from office
                if (shouldFetchArrivals()) {
                  try {
                    const fullArrivalUrl = proxyUrl + encodeURIComponent(arrivalUrl);
                    console.log('Fetching arrivals from:', fullArrivalUrl);

                    const arrivalsResponse = await fetch(fullArrivalUrl, {
                        method: 'GET',
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });

                    console.log('Arrivals response status:', arrivalsResponse.status);
                    const responseText = await arrivalsResponse.text();
                    console.log('Arrivals response preview:', responseText.substring(0, 200));

                    if (arrivalsResponse.ok && responseText && !responseText.startsWith('Bad Request')) {
                        const arrivalsData = JSON.parse(responseText);
                        const arrivals = arrivalsData.data?.flights || arrivalsData.Flights || arrivalsData.flights || [];

                        console.log(`Found ${arrivals.length} arrivals in DUS API response`);
                        if (arrivals.length > 0) {
                            console.log('Sample arrival:', JSON.stringify(arrivals[0]));
                            // Log all unique statuses to help understand what's available
                            const statuses = [...new Set(arrivals.map(f => f.status?.publicStatus?.name).filter(Boolean))];
                            console.log('Arrival statuses seen:', statuses);
                        }

                        // Store arrivals for time-based matching - filter for active flights only
                        console.log(`Before filtering: ${arrivals.length} arrivals`);
                        dusArrivals = arrivals
                            .filter(flight => {
                                const isActive = isActiveArrival(flight);
                                if (!isActive) {
                                    const status = flight.status?.publicStatus?.name || 'unknown';
                                    console.log(`Filtered out arrival ${flight.flightNumber} with status: ${status}`);
                                }
                                return isActive;
                            })
                            .map(flight => {
                            const flightNumber = flight.flightNumber || '';
                            const airlineName = flight.airline?.name || '';
                            const registration = flight.aircraft?.registration || '';

                            // Get full city name and country
                            const originCity = flight.destination?.city?.name || flight.destination?.name || '';
                            const originCountry = flight.destination?.city?.country?.name || '';
                            const originIata = flight.destination?.iataCode || '';

                            // Format: "City, Country" or fallback to IATA if city unknown
                            let originFull = originCity;
                            if (originCity && originCountry) {
                                originFull = `${originCity}, ${originCountry}`;
                            } else if (!originCity && originIata) {
                                originFull = originIata;
                            }

                            // Parse times (estimated > actual > scheduled)
                            const timeStr = flight.actualTime || flight.estimatedTime || flight.scheduledTime;
                            const time = timeStr ? new Date(timeStr) : null;

                            return {
                                flightNumber: flightNumber.trim(),
                                origin: originFull,
                                destination: 'Düsseldorf, Germany',
                                airline: airlineName,
                                registration: registration,
                                time: time,
                                timeStr: timeStr,
                                status: flight.status?.publicStatus?.name || 'unknown'
                            };
                        }).filter(f => f.flightNumber && f.time);
                        console.log(`After filtering: ${dusArrivals.length} active arrivals (from ${arrivals.length} total)`);
                    } else {
                        console.log('Arrivals request failed or returned bad data');
                    }
                  } catch (err) {
                    console.error('Error fetching arrivals:', err);
                  }
                } else {
                    console.log('Skipping arrivals fetch - not visible from office');
                }

                // Fetch departures only if visible from office
                if (shouldFetchDepartures()) {
                  try {
                    const fullDepartureUrl = proxyUrl + encodeURIComponent(departureUrl);
                    console.log('Fetching departures from:', fullDepartureUrl);

                    const departuresResponse = await fetch(fullDepartureUrl, {
                        method: 'GET',
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });

                    console.log('Departures response status:', departuresResponse.status);
                    const responseText = await departuresResponse.text();
                    console.log('Departures response preview:', responseText.substring(0, 200));

                    if (departuresResponse.ok && responseText && !responseText.startsWith('Bad Request')) {
                        const departuresData = JSON.parse(responseText);
                        const departures = departuresData.data?.flights || departuresData.Flights || departuresData.flights || [];

                        console.log(`Found ${departures.length} departures in DUS API response`);
                        if (departures.length > 0) {
                            console.log('Sample departure:', JSON.stringify(departures[0]));
                            // Log all unique statuses to help understand what's available
                            const statuses = [...new Set(departures.map(f => f.status?.publicStatus?.name).filter(Boolean))];
                            console.log('Departure statuses seen:', statuses);
                        }

                        // Store departures for time-based matching - filter for active flights only
                        console.log(`Before filtering: ${departures.length} departures`);
                        dusDepartures = departures
                            .filter(flight => {
                                const isActive = isActiveDeparture(flight);
                                if (!isActive) {
                                    const status = flight.status?.publicStatus?.name || 'unknown';
                                    console.log(`Filtered out departure ${flight.flightNumber} with status: ${status}`);
                                }
                                return isActive;
                            })
                            .map(flight => {
                            const flightNumber = flight.flightNumber || '';
                            const airlineName = flight.airline?.name || '';
                            const registration = flight.aircraft?.registration || '';

                            // Get full city name and country
                            const destCity = flight.destination?.city?.name || flight.destination?.name || '';
                            const destCountry = flight.destination?.city?.country?.name || '';
                            const destIata = flight.destination?.iataCode || '';

                            // Format: "City, Country" or fallback to IATA if city unknown
                            let destFull = destCity;
                            if (destCity && destCountry) {
                                destFull = `${destCity}, ${destCountry}`;
                            } else if (!destCity && destIata) {
                                destFull = destIata;
                            }

                            // Parse times (estimated > actual > scheduled)
                            const timeStr = flight.actualTime || flight.estimatedTime || flight.scheduledTime;
                            const time = timeStr ? new Date(timeStr) : null;

                            return {
                                flightNumber: flightNumber.trim(),
                                origin: 'Düsseldorf, Germany',
                                destination: destFull,
                                airline: airlineName,
                                registration: registration,
                                time: time,
                                timeStr: timeStr,
                                status: flight.status?.publicStatus?.name || 'unknown'
                            };
                        }).filter(f => f.flightNumber && f.time);
                        console.log(`After filtering: ${dusDepartures.length} active departures (from ${departures.length} total)`);
                    } else {
                        console.log('Departures request failed or returned bad data');
                    }
                  } catch (err) {
                    console.error('Error fetching departures:', err);
                  }
                } else {
                    console.log('Skipping departures fetch - not visible from office');
                }

                console.log(`Stored ${dusArrivals.length} arrivals and ${dusDepartures.length} departures`);
            } catch (error) {
                console.error('Error fetching DUS Airport data:', error);
            }
        }

        // Match flight by time (more reliable than callsign matching)
        function matchFlightByTime(status, distanceToAirport) {
            const now = new Date();
            const timeWindow = 30 * 60 * 1000; // 30 minutes in milliseconds

            // Choose the right list based on arrival/departure
            const flightList = status === 'arriving' ? dusArrivals : dusDepartures;

            // Find flights within time window
            const candidates = flightList.filter(f => {
                const timeDiff = Math.abs(f.time - now);
                return timeDiff <= timeWindow;
            });

            if (candidates.length === 0) return null;

            // Sort by time proximity (closest to now)
            candidates.sort((a, b) => Math.abs(a.time - now) - Math.abs(b.time - now));

            // Return the closest match
            const match = candidates[0];
            const minutesAway = Math.round((match.time - now) / 60000);
            console.log(`Time-matched ${status} flight: ${match.flightNumber} (${match.airline}) ${minutesAway > 0 ? 'in ' + minutesAway + ' min' : Math.abs(minutesAway) + ' min ago'}`);

            return match;
        }

        // Extract airline name from callsign or flight number
        function extractAirlineName(callsign, flightNumber) {
            const airlines = {
                'DLH': 'Lufthansa',
                'EWG': 'Eurowings',
                'EW': 'Eurowings',
                'RYR': 'Ryanair',
                'FR': 'Ryanair',

                'OS': 'Austrian Airlines',
                'SWR': 'Swiss',

                'CFG': 'Condor',
                'DE': 'Condor',
                'TUI': 'TUI',
                'X3': 'TUI',
                'BEE': 'FlyBe',
                'BE': 'FlyBe',
                'LOG': 'Loganair',
                'LM': 'Loganair',
                'AIB': 'Avanti Air'
            };

            // Try to match the first 2-3 characters of the callsign
            const code = callsign.substring(0, 3).toUpperCase();
            if (airlines[code]) return airlines[code];

            const code2 = callsign.substring(0, 2).toUpperCase();
            if (airlines[code2]) return airlines[code2];

            // Try from flight number
            if (flightNumber) {
                const fnCode = flightNumber.substring(0, 2).toUpperCase();
                if (airlines[fnCode]) return airlines[fnCode];
            }

            return '';
        }

        // Display DUS flights directly (without OpenSky data)
        async function displayDUSFlights() {
            const container = document.getElementById('flights-container');

            // Combine active arrivals and departures, filtered by runway visibility
            const visibleArrivals = isVisibleFromOffice(true)
                ? dusArrivals.map(f => ({...f, flightStatus: 'arriving'}))
                : [];

            const visibleDepartures = isVisibleFromOffice(false)
                ? dusDepartures.map(f => ({...f, flightStatus: 'departing'}))
                : [];

            const allFlights = [...visibleArrivals, ...visibleDepartures];

            if (allFlights.length === 0) {
                container.innerHTML = `
                    <div class="no-flights">
                        <div class="plane-icon">🔍</div>
                        <div>No active flights</div>
                        <div style="font-size: 0.8em; margin-top: 15px; opacity: 0.7;">
                            Waiting for flights in approach or taxiing...
                        </div>
                    </div>
                `;
                return;
            }

            // Sort by time (soonest first)
            allFlights.sort((a, b) => a.time - b.time);

            // Display flight rows with placeholders first
            container.innerHTML = allFlights.map(flight => {
                const flightNumber = flight.flightNumber;
                const airline = flight.airline || '';
                const flightStatus = flight.flightStatus;

                // Get the location to show (origin for arrivals, destination for departures)
                let location, locationLabel, countryFlag;
                if (flightStatus === 'arriving') {
                    location = flight.origin || '';
                    locationLabel = 'from';
                    const country = extractCountryFromLocation(location);
                    countryFlag = getCountryFlag(country);
                } else {
                    location = flight.destination || '';
                    locationLabel = 'to';
                    const country = extractCountryFromLocation(location);
                    countryFlag = getCountryFlag(country);
                }

                // Create unique ID for this flight row
                const rowId = `flight-${flightNumber.replace(/\s/g, '-')}`;

                return `
                    <div class="flight-row ${flightStatus}" id="${rowId}">
                        <div class="flight-photo" id="${rowId}-photo">✈️</div>
                        <div class="flight-info">
                            <div class="flight-number">${flightNumber}</div>
                            ${airline ? `<div class="flight-airline">${airline}</div>` : ''}
                            <div class="flight-route">${countryFlag} ${locationLabel} ${location}</div>
                        </div>
                        <div class="status-badge ${flightStatus}">${flightStatus}</div>
                    </div>
                `;
            }).join('');

            // Asynchronously fetch and update aircraft photos
            allFlights.forEach(async (flight) => {
                if (flight.registration) {
                    const photoUrl = await fetchAircraftPhoto(flight.registration);
                    if (photoUrl) {
                        const rowId = `flight-${flight.flightNumber.replace(/\s/g, '-')}`;
                        const photoElement = document.getElementById(`${rowId}-photo`);
                        if (photoElement) {
                            photoElement.innerHTML = `<img src="${photoUrl}" alt="${flight.registration}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 6px;" onerror="this.parentElement.innerHTML='✈️'">`;
                        }
                    }
                }
            });

            document.getElementById('last-update').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
        }

        // Update ATIS and runway configuration
        async function updateATIS() {
            const now = Date.now();
            // Fetch every 5 minutes (runways don't change often)
            if (now - lastATISFetch > 300000 || lastATISFetch === 0) {
                const runwayConfig = await fetchATIS();
                if (runwayConfig) {
                    activeRunways = runwayConfig;
                    lastATISFetch = now;
                    console.log('Updated runway configuration from ATIS');
                }
            }
        }

        // Update flight details cache and display
        async function updateFlightDetailsCache() {
            const now = Date.now();
            // Fetch every minute for live updates
            if (now - lastDetailsFetch > 60000 || lastDetailsFetch === 0) {
                // Update ATIS first to get current runway config
                await updateATIS();

                await fetchDUSFlights();

                lastDetailsFetch = now;
                console.log(`Flight details updated: ${dusArrivals.length} arrivals, ${dusDepartures.length} departures from DUS Airport`);

                // Display DUS flights directly (no need to wait for OpenSky)
                displayDUSFlights();
            }
        }

        // Initial load - fetch DUS Airport data immediately
        updateFlightDetailsCache();

        // Refresh DUS Airport data every minute for live updates
        setInterval(updateFlightDetailsCache, 60000);
    </script>
