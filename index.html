<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITQ Plane Spotter - Düsseldorf Airport</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .location-info {
            font-size: 1.1em;
            opacity: 0.9;
            margin-top: 10px;
        }

        .status {
            text-align: center;
            padding: 15px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 1.1em;
        }

        .loading {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .flights-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .flight-card {
            background: rgba(255, 255, 255, 0.95);
            color: #1e3c72;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideIn 0.5s ease;
        }

        .flight-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 48px rgba(0,0,0,0.3);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .flight-card.arriving {
            border-left: 5px solid #22c55e;
        }

        .flight-card.departing {
            border-left: 5px solid #f59e0b;
        }


        .flight-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(30, 60, 114, 0.1);
        }

        .callsign {
            font-size: 1.8em;
            font-weight: bold;
            color: #1e3c72;
        }

        .status-badge {
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-badge.arriving {
            background: #22c55e;
            color: white;
        }

        .status-badge.departing {
            background: #f59e0b;
            color: white;
        }

        .flight-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.85em;
            color: #64748b;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-size: 1.2em;
            font-weight: 600;
            color: #1e3c72;
        }

        .origin-dest {
            grid-column: span 2;
            margin-top: 10px;
            padding: 15px;
            background: rgba(30, 60, 114, 0.05);
            border-radius: 10px;
            text-align: center;
        }

        .origin-dest .detail-value {
            font-size: 1.4em;
            color: #1e3c72;
        }

        .distance-info {
            grid-column: span 2;
            text-align: center;
            padding: 10px;
            background: rgba(30, 60, 114, 0.08);
            border-radius: 8px;
            margin-top: 10px;
        }

        .distance-info .detail-value {
            font-size: 1.1em;
        }

        .footer {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 30px;
        }

        .last-update {
            font-size: 0.95em;
            opacity: 0.8;
        }

        .no-flights {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            font-size: 1.3em;
        }

        .plane-icon {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .map-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .map-title {
            text-align: center;
            font-size: 1.2em;
            margin-bottom: 15px;
            font-weight: 600;
        }

        #viewing-map {
            width: 100%;
            height: 400px;
            border-radius: 10px;
            background: #ffffff;
            display: block;
        }

        .route-info {
            grid-column: span 2;
            margin-top: 10px;
            padding: 15px;
            background: rgba(30, 60, 114, 0.05);
            border-radius: 10px;
        }

        .route-info .detail-value {
            font-size: 1.3em;
            color: #1e3c72;
            margin-top: 5px;
        }

        .route-arrow {
            font-size: 1.5em;
            margin: 0 10px;
            color: #64748b;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .flights-container {
                grid-template-columns: 1fr;
            }

            .callsign {
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✈️ ITQ Plane Spotter</h1>
            <div class="location-info">
                <strong>Düsseldorf Airport (EDDL)</strong><br>
                Viewing from: Wanheimer Str. 43, 40472 Düsseldorf (Looking North)
            </div>
        </header>

        <div class="status" id="status">
            <span class="loading">Loading flight data...</span>
        </div>

        <div class="map-container">
            <div class="map-title">Your Viewing Area (Looking North)</div>
            <canvas id="viewing-map"></canvas>
        </div>

        <div class="flights-container" id="flights-container">
        </div>

        <div class="footer">
            <div class="last-update" id="last-update">Waiting for data...</div>
            <div style="margin-top: 10px; opacity: 0.7; font-size: 0.9em;">
                Data updates every 30 seconds | Powered by OpenSky Network
            </div>
        </div>
    </div>

    <script>
        // Düsseldorf Airport coordinates
        const DUS_LAT = 51.2895;
        const DUS_LON = 6.7668;

        // Your office coordinates
        const OFFICE_LAT = 51.2445;
        const OFFICE_LON = 6.7891;

        // Radius in degrees (roughly 50km)
        const SEARCH_RADIUS = 0.5;

        // Viewing angle from office (looking north: 315° to 45° = NW to NE)
        const VIEW_BEARING_MIN = 315;
        const VIEW_BEARING_MAX = 45;

        let lastUpdate = null;
        let flightRoutes = {}; // Store flight route information

        // Airport code to city/name mapping
        const AIRPORT_NAMES = {
            'EDDL': 'Düsseldorf',
            'EDDF': 'Frankfurt',
            'EDDM': 'Munich',
            'EDDB': 'Berlin Brandenburg',
            'EDDH': 'Hamburg',
            'EDDK': 'Cologne/Bonn',
            'EDDT': 'Berlin Tegel',
            'EDDW': 'Bremen',
            'EDDN': 'Nuremberg',
            'EDDV': 'Hannover',
            'EDDS': 'Stuttgart',
            'EDDP': 'Leipzig',
            'LOWW': 'Vienna',
            'LSZH': 'Zurich',
            'LSGG': 'Geneva',
            'EHAM': 'Amsterdam',
            'EBBR': 'Brussels',
            'EGLL': 'London Heathrow',
            'EGKK': 'London Gatwick',
            'EGSS': 'London Stansted',
            'LFPG': 'Paris CDG',
            'LFPO': 'Paris Orly',
            'LIRF': 'Rome Fiumicino',
            'LIMC': 'Milan Malpensa',
            'LEMD': 'Madrid',
            'LEBL': 'Barcelona',
            'LPPT': 'Lisbon',
            'BIKF': 'Reykjavik',
            'EKCH': 'Copenhagen',
            'ENGM': 'Oslo',
            'ESSA': 'Stockholm Arlanda',
            'EFHK': 'Helsinki',
            'EVRA': 'Riga',
            'EYVI': 'Vilnius',
            'EPWA': 'Warsaw',
            'LKPR': 'Prague',
            'LHBP': 'Budapest',
            'LROP': 'Bucharest',
            'LBSF': 'Sofia',
            'LGAV': 'Athens',
            'LTFM': 'Istanbul',
            'OMDB': 'Dubai',
            'OTHH': 'Doha',
            'KJFK': 'New York JFK',
            'KEWR': 'Newark',
            'KORD': 'Chicago',
            'KLAX': 'Los Angeles',
            'KSFO': 'San Francisco',
            'CYYZ': 'Toronto',
            'ZBAA': 'Beijing',
            'ZSPD': 'Shanghai',
            'RJTT': 'Tokyo Haneda',
            'VHHH': 'Hong Kong',
            'WSSS': 'Singapore',
            'YSSY': 'Sydney'
        };

        // Get airport name from ICAO code
        function getAirportName(icao) {
            if (!icao) return 'Unknown';
            return AIRPORT_NAMES[icao.toUpperCase()] || icao;
        }

        // Calculate distance between two points (Haversine formula)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                     Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                     Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Calculate bearing from office to plane
        function calculateBearing(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                     Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
            const bearing = Math.atan2(y, x) * 180 / Math.PI;
            return (bearing + 360) % 360;
        }

        // Get direction from bearing
        function getDirection(bearing) {
            const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
            const index = Math.round(bearing / 22.5) % 16;
            return directions[index];
        }

        // Check if bearing is within viewing angle (looking north)
        function isInViewingAngle(bearing) {
            // North view: 315° to 45° (wraps around 0°/360°)
            if (VIEW_BEARING_MIN > VIEW_BEARING_MAX) {
                return bearing >= VIEW_BEARING_MIN || bearing <= VIEW_BEARING_MAX;
            }
            return bearing >= VIEW_BEARING_MIN && bearing <= VIEW_BEARING_MAX;
        }

        // Determine flight status (arriving or departing only)
        function determineFlightStatus(lat, lon, altitude, verticalRate, velocity, icao24) {
            const distanceToAirport = calculateDistance(lat, lon, DUS_LAT, DUS_LON);

            // Check if we have route info for this flight
            if (flightRoutes[icao24]) {
                return flightRoutes[icao24].status;
            }

            // Fallback to heuristic: within 30km of airport
            if (distanceToAirport < 30) {
                // Descending = arriving, ascending/level = departing
                if (verticalRate < -0.5) {
                    return 'arriving';
                } else {
                    return 'departing';
                }
            }

            // Default: use altitude to guess
            if (altitude < 3000) {
                return 'arriving';
            } else {
                return 'departing';
            }
        }

        // Format altitude
        function formatAltitude(meters) {
            if (!meters && meters !== 0) return 'N/A';
            const feet = Math.round(meters * 3.28084);
            return `${meters.toFixed(0)}m (${feet}ft)`;
        }

        // Format speed
        function formatSpeed(metersPerSecond) {
            if (!metersPerSecond && metersPerSecond !== 0) return 'N/A';
            const kmh = metersPerSecond * 3.6;
            const knots = metersPerSecond * 1.94384;
            return `${kmh.toFixed(0)} km/h (${knots.toFixed(0)} kt)`;
        }

        // Format vertical rate
        function formatVerticalRate(rate) {
            if (!rate && rate !== 0) return 'Level';
            const fpm = rate * 196.85; // m/s to ft/min
            const direction = rate > 0 ? '↑' : '↓';
            return `${direction} ${Math.abs(fpm).toFixed(0)} ft/min`;
        }

        // Fetch arrival/departure information for Düsseldorf Airport
        async function fetchFlightRoutes() {
            try {
                const now = Math.floor(Date.now() / 1000);
                const twoHoursAgo = now - 7200;
                const twoHoursLater = now + 7200;

                // Fetch both arrivals and departures
                const [arrivalsRes, departuresRes] = await Promise.all([
                    fetch(`https://opensky-network.org/api/flights/arrival?airport=EDDL&begin=${twoHoursAgo}&end=${now}`),
                    fetch(`https://opensky-network.org/api/flights/departure?airport=EDDL&begin=${twoHoursAgo}&end=${now}`)
                ]);

                const arrivals = arrivalsRes.ok ? await arrivalsRes.json() : [];
                const departures = departuresRes.ok ? await departuresRes.json() : [];

                // Store route information indexed by icao24
                const routes = {};

                arrivals.forEach(flight => {
                    if (flight.icao24 && flight.estDepartureAirport) {
                        routes[flight.icao24] = {
                            status: 'arriving',
                            from: flight.estDepartureAirport,
                            to: 'EDDL',
                            callsign: flight.callsign ? flight.callsign.trim() : null
                        };
                    }
                });

                departures.forEach(flight => {
                    if (flight.icao24 && flight.estArrivalAirport) {
                        routes[flight.icao24] = {
                            status: 'departing',
                            from: 'EDDL',
                            to: flight.estArrivalAirport,
                            callsign: flight.callsign ? flight.callsign.trim() : null
                        };
                    }
                });

                return routes;
            } catch (error) {
                console.error('Error fetching flight routes:', error);
                return {};
            }
        }

        // Fetch flights from OpenSky Network API
        async function fetchFlights() {
            try {
                const minLat = DUS_LAT - SEARCH_RADIUS;
                const maxLat = DUS_LAT + SEARCH_RADIUS;
                const minLon = DUS_LON - SEARCH_RADIUS;
                const maxLon = DUS_LON + SEARCH_RADIUS;

                const url = `https://opensky-network.org/api/states/all?lamin=${minLat}&lomin=${minLon}&lamax=${maxLat}&lomax=${maxLon}`;

                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                lastUpdate = new Date();

                return data.states || [];
            } catch (error) {
                console.error('Error fetching flights:', error);
                document.getElementById('status').innerHTML = `<span style="color: #ff6b6b;">Error loading flight data. Retrying in 30 seconds...</span>`;
                return [];
            }
        }

        // Draw map showing viewing area
        function drawMap(flights) {
            const canvas = document.getElementById('viewing-map');
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;

            // Set canvas size
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            const width = rect.width;
            const height = rect.height;

            // Clear canvas
            ctx.fillStyle = '#f0f9ff';
            ctx.fillRect(0, 0, width, height);

            // Map scale (roughly 30km view)
            const kmPerPixel = 30 / Math.min(width, height) * 1.5;

            // Center on office
            const centerX = width / 2;
            const centerY = height / 2;

            // Draw viewing cone (north-facing)
            ctx.fillStyle = 'rgba(34, 197, 94, 0.1)';
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            const radius = Math.min(width, height) * 0.6;
            ctx.arc(centerX, centerY, radius, -135 * Math.PI / 180, -45 * Math.PI / 180);
            ctx.closePath();
            ctx.fill();

            // Draw viewing cone borders
            ctx.strokeStyle = 'rgba(34, 197, 94, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(centerX - radius * Math.cos(45 * Math.PI / 180), centerY - radius * Math.sin(45 * Math.PI / 180));
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(centerX + radius * Math.cos(45 * Math.PI / 180), centerY - radius * Math.sin(45 * Math.PI / 180));
            ctx.stroke();

            // Draw distance rings
            ctx.strokeStyle = 'rgba(100, 116, 139, 0.2)';
            ctx.lineWidth = 1;
            [10, 20, 30].forEach((km, i) => {
                const r = km / kmPerPixel;
                ctx.beginPath();
                ctx.arc(centerX, centerY, r, 0, 2 * Math.PI);
                ctx.stroke();
                ctx.fillStyle = '#64748b';
                ctx.font = '10px sans-serif';
                ctx.fillText(km + 'km', centerX + 5, centerY - r + 15);
            });

            // Draw office location
            ctx.fillStyle = '#1e3c72';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 8, 0, 2 * Math.PI);
            ctx.fill();
            ctx.fillStyle = '#1e3c72';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText('ITQ Office', centerX + 12, centerY + 4);

            // Draw airport
            const airportDist = calculateDistance(OFFICE_LAT, OFFICE_LON, DUS_LAT, DUS_LON);
            const airportBearing = calculateBearing(OFFICE_LAT, OFFICE_LON, DUS_LAT, DUS_LON);
            const airportAngle = (airportBearing - 90) * Math.PI / 180;
            const airportR = airportDist / kmPerPixel;
            const airportX = centerX + airportR * Math.cos(airportAngle);
            const airportY = centerY + airportR * Math.sin(airportAngle);

            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.arc(airportX, airportY, 6, 0, 2 * Math.PI);
            ctx.fill();
            ctx.fillStyle = '#f59e0b';
            ctx.font = 'bold 11px sans-serif';
            ctx.fillText('EDDL', airportX + 10, airportY + 4);

            // Draw planes
            flights.forEach(flight => {
                const dist = flight.distanceFromOffice;
                const bearing = flight.bearing;
                const angle = (bearing - 90) * Math.PI / 180;
                const r = dist / kmPerPixel;
                const x = centerX + r * Math.cos(angle);
                const y = centerY + r * Math.sin(angle);

                // Only draw if within canvas
                if (x >= 0 && x <= width && y >= 0 && y <= height) {
                    ctx.fillStyle = flight.status === 'arriving' ? '#22c55e' : '#f59e0b';
                    ctx.beginPath();
                    // Draw plane as triangle pointing in heading direction
                    const headingAngle = (flight.true_track - 90) * Math.PI / 180;
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(headingAngle);
                    ctx.moveTo(0, -6);
                    ctx.lineTo(-4, 4);
                    ctx.lineTo(4, 4);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }
            });

            // Draw compass
            ctx.fillStyle = '#1e3c72';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('N', centerX, 30);
        }

        // Display flights
        function displayFlights(flights) {
            const container = document.getElementById('flights-container');

            if (!flights || flights.length === 0) {
                container.innerHTML = `
                    <div class="no-flights">
                        <div class="plane-icon">🔍</div>
                        <div>No flights visible in your viewing area</div>
                        <div style="font-size: 0.8em; margin-top: 15px; opacity: 0.7;">
                            Looking north from ITQ office...
                        </div>
                    </div>
                `;
                document.getElementById('status').innerHTML = `<span>No visible flights</span>`;
                drawMap([]);
                return;
            }

            // Process and filter flights
            const processedFlights = flights.map(flight => {
                const [icao24, callsign, origin_country, time_position, last_contact,
                       longitude, latitude, baro_altitude, on_ground, velocity,
                       true_track, vertical_rate] = flight;

                const distanceFromOffice = calculateDistance(OFFICE_LAT, OFFICE_LON, latitude, longitude);
                const bearing = calculateBearing(OFFICE_LAT, OFFICE_LON, latitude, longitude);
                const direction = getDirection(bearing);
                const status = determineFlightStatus(latitude, longitude, baro_altitude, vertical_rate, velocity, icao24);

                // Get route information
                const routeInfo = flightRoutes[icao24] || null;

                return {
                    icao24,
                    callsign: callsign ? callsign.trim() : icao24.toUpperCase(),
                    origin_country,
                    latitude,
                    longitude,
                    altitude: baro_altitude,
                    velocity,
                    true_track,
                    vertical_rate,
                    on_ground,
                    distanceFromOffice,
                    bearing,
                    direction,
                    status,
                    routeInfo
                };
            }).filter(f => !f.on_ground && isInViewingAngle(f.bearing)); // Only airborne & visible

            // Sort by distance from office (closest first)
            processedFlights.sort((a, b) => a.distanceFromOffice - b.distanceFromOffice);

            // Count by status
            const arriving = processedFlights.filter(f => f.status === 'arriving').length;
            const departing = processedFlights.filter(f => f.status === 'departing').length;

            document.getElementById('status').innerHTML = `
                <strong>Visible Flights:</strong>
                <span style="color: #22c55e;">Arriving: ${arriving}</span> |
                <span style="color: #f59e0b;">Departing: ${departing}</span>
            `;

            // Display flights
            container.innerHTML = processedFlights.map(flight => {
                let routeDisplay = '';
                if (flight.routeInfo) {
                    const fromCity = getAirportName(flight.routeInfo.from);
                    const toCity = getAirportName(flight.routeInfo.to);
                    routeDisplay = `
                        <div class="route-info">
                            <div class="detail-label">${flight.status === 'arriving' ? 'Coming From' : 'Going To'}</div>
                            <div class="detail-value">
                                ${fromCity} <span class="route-arrow">→</span> ${toCity}
                            </div>
                        </div>
                    `;
                } else {
                    routeDisplay = `
                        <div class="route-info">
                            <div class="detail-label">Route</div>
                            <div class="detail-value" style="font-size: 1.1em;">
                                ${flight.status === 'arriving' ? 'Arriving at Düsseldorf' : 'Departing from Düsseldorf'}
                            </div>
                        </div>
                    `;
                }

                return `
                    <div class="flight-card ${flight.status}">
                        <div class="flight-header">
                            <div class="callsign">${flight.callsign}</div>
                            <div class="status-badge ${flight.status}">${flight.status}</div>
                        </div>
                        <div class="flight-details">
                            <div class="detail-item">
                                <div class="detail-label">Altitude</div>
                                <div class="detail-value">${formatAltitude(flight.altitude)}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Speed</div>
                                <div class="detail-value">${formatSpeed(flight.velocity)}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Heading</div>
                                <div class="detail-value">${flight.true_track ? flight.true_track.toFixed(0) + '°' : 'N/A'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Vertical Rate</div>
                                <div class="detail-value">${formatVerticalRate(flight.vertical_rate)}</div>
                            </div>
                            ${routeDisplay}
                            <div class="distance-info">
                                <div class="detail-label">From Your Location</div>
                                <div class="detail-value">${flight.distanceFromOffice.toFixed(1)} km ${flight.direction} (${flight.bearing.toFixed(0)}°)</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Update last update time
            document.getElementById('last-update').textContent = `Last updated: ${lastUpdate.toLocaleTimeString()}`;

            // Draw map with visible flights
            drawMap(processedFlights);
        }

        // Update flights
        async function updateFlights() {
            const flights = await fetchFlights();
            displayFlights(flights);
        }

        // Update flight routes (less frequently)
        async function updateFlightRoutes() {
            flightRoutes = await fetchFlightRoutes();
            console.log('Flight routes updated:', Object.keys(flightRoutes).length);
        }

        // Initial load
        updateFlightRoutes(); // Load routes first
        updateFlights();

        // Refresh flights every 30 seconds
        setInterval(updateFlights, 30000);

        // Refresh routes every 5 minutes
        setInterval(updateFlightRoutes, 300000);
    </script>
</body>
</html>
