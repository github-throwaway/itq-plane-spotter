<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>skITQ - Real-Time Aviation Intelligence</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #0057a3;
            --dark-blue: #004080;
            --darker-blue: #003060;
            --navy-900: #0f172a;
            --navy-800: #1e293b;
            --navy-700: #334155;
            --charcoal: #1a1a1a;
            --orange: #ff6b35;
            --orange-hover: #ff5722;
            --white: #ffffff;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-200-alpha: rgba(226, 232, 240, 0.1);
            --gray-600: #475569;
            --gray-700: #334155;
            --white-semi: rgba(255, 255, 255, 0.6);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--primary-blue);
            color: var(--white);
            padding: 0;
            height: 100vh;
            line-height: 1.6;
            overflow: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0;
        }


        .main-section {
            padding: 0;
            background: var(--primary-blue);
            height: calc(100vh - 60px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 25% 40% 35%;
            grid-template-rows: auto 1fr;
            gap: 0;
            height: 100%;
            width: 100%;
        }

        .weather-panel {
            grid-column: 1;
            grid-row: 1 / 3;
            background: var(--primary-blue);
            padding: 30px;
            overflow: hidden;
            border-right: 1px solid var(--gray-200-alpha);
        }

        .map-panel {
            grid-column: 2;
            grid-row: 1 / 3;
            background: var(--primary-blue);
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .flights-panel {
            grid-column: 3;
            grid-row: 1 / 3;
            background: var(--primary-blue);
            padding: 30px;
            overflow: hidden;
            border-left: 1px solid var(--gray-200-alpha);
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }

        .section-title {
            font-size: 1.8em;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 20px;
            letter-spacing: -0.8px;
            padding-bottom: 0;
            border-bottom: none;
            flex-shrink: 0;
        }

        .flights-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            flex: 1;
            padding-right: 8px;
            min-height: 0;
        }

        .flights-container::-webkit-scrollbar {
            width: 8px;
        }

        .flights-container::-webkit-scrollbar-track {
            background: var(--dark-blue);
            border-radius: 4px;
        }

        .flights-container::-webkit-scrollbar-thumb {
            background: var(--white-semi);
            border-radius: 4px;
        }

        .flights-container::-webkit-scrollbar-thumb:hover {
            background: var(--white);
        }

        .upcoming-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .upcoming-container::-webkit-scrollbar {
            width: 6px;
        }

        .upcoming-container::-webkit-scrollbar-track {
            background: var(--dark-blue);
            border-radius: 4px;
        }

        .upcoming-container::-webkit-scrollbar-thumb {
            background: var(--white-semi);
            border-radius: 4px;
        }

        .upcoming-row {
            background: rgba(0, 0, 0, 0.15);
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid var(--gray-200-alpha);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .upcoming-row:hover {
            background: rgba(0, 0, 0, 0.25);
            border-color: var(--white-semi);
        }

        .upcoming-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .upcoming-flight-number {
            font-size: 1.1em;
            font-weight: 700;
            color: var(--white);
        }

        .upcoming-route {
            font-size: 0.75em;
            color: var(--white-semi);
        }

        .upcoming-eta {
            font-size: 1.2em;
            font-weight: 700;
            color: var(--orange);
            text-align: right;
        }

        .upcoming-eta-label {
            font-size: 0.65em;
            color: var(--white-semi);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .flight-row {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 8px;
            transition: all 0.2s ease;
            animation: slideIn 0.4s ease;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid var(--gray-200-alpha);
            position: relative;
            overflow: hidden;
        }

        .flight-row::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--white);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .flight-row:hover {
            background: rgba(0, 0, 0, 0.3);
            border-color: var(--white);
        }

        .flight-row:hover::before {
            opacity: 1;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .flight-row.arriving::after {
            content: '↓';
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.3em;
            color: var(--white);
            opacity: 0.2;
            font-weight: 700;
        }

        .flight-row.departing::after {
            content: '↑';
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.3em;
            color: var(--white);
            opacity: 0.2;
            font-weight: 700;
        }

        .flight-header {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .flight-photo {
            width: 100px;
            height: 75px;
            object-fit: contain;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            border: 1px solid var(--gray-200-alpha);
            flex-shrink: 0;
        }

        .flight-photo img {
            object-fit: contain !important;
        }

        .flight-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .flight-number {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--white);
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .flight-airline {
            font-size: 0.8em;
            color: var(--white-semi);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .flight-route {
            font-size: 1.1em;
            color: var(--white);
            font-weight: 600;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .flight-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--gray-200-alpha);
        }

        .flight-aircraft {
            font-size: 0.85em;
            color: var(--white-semi);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .flight-aircraft-type {
            color: var(--white);
            font-weight: 600;
            margin-left: 0;
        }

        .flight-airports {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 16px;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 6px;
        }

        .airport-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .airport-info.destination {
            text-align: right;
        }

        .airport-code {
            font-size: 1.2em;
            font-weight: 700;
            color: var(--white);
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .airport-city {
            font-size: 0.75em;
            color: var(--white-semi);
            font-weight: 500;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .flight-arrow {
            font-size: 1.8em;
            color: var(--white);
            opacity: 0.6;
        }

        .flight-times {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }

        .time-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(0, 0, 0, 0.15);
            padding: 8px 10px;
            border-radius: 4px;
        }

        .time-label {
            font-size: 0.7em;
            color: var(--white-semi);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            font-weight: 600;
            line-height: 1.2;
            white-space: nowrap;
        }

        .time-value {
            font-size: 1em;
            color: var(--white);
            font-weight: 700;
            line-height: 1;
        }
        
        .time-value.crossed-out {
            text-decoration: line-through;
            opacity: 0.6;
            color: var(--white-semi);
        }
        
        .merged-time-block {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .time-value-container {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: var(--orange);
            color: var(--white);
            box-shadow: 0 2px 8px rgba(255, 107, 53, 0.25);
        }

        .footer {
            background: var(--darker-blue);
            color: var(--white);
            padding: 16px 40px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-top: 1px solid var(--gray-200-alpha);
        }

        .footer-update {
            text-align: center;
        }

        .footer-update-label {
            font-size: 0.7em;
            color: var(--white-semi);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .footer-update-time {
            font-size: 0.85em;
            color: var(--white);
            font-weight: 600;
        }

        .no-flights {
            text-align: center;
            padding: 60px 30px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            border: 2px dashed var(--gray-200-alpha);
        }

        .plane-icon {
            font-size: 3em;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .no-flights-title {
            font-size: 1.3em;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 8px;
        }

        .no-flights-text {
            font-size: 0.9em;
            color: var(--white-semi);
        }

        .map-container {
            width: 100%;
            flex: 1;
            border-radius: 0;
            overflow: hidden;
            border: none;
            background: var(--dark-blue);
            position: relative;
            box-shadow: none;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Block FlightRadar24 app store badges with overlay */
        .map-badges-blocker {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 140px;
            height: 100px;
            background: var(--primary-blue);
            z-index: 100;
            pointer-events: none;
        }

        .metar-container {
            width: 100%;
            flex: 1;
            position: relative;
            background: transparent;
            border-radius: 0;
            overflow: visible;
            border: none;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .metar-container,
        .metar-container *,
        .metar-container iframe,
        .metar-container div,
        .metar-container a {
            pointer-events: none !important;
            cursor: default !important;
        }

        .metar-container iframe {
            width: 100% !important;
            height: 100% !important;
            max-width: 320px !important;
            border: 0;
        }

        .metar-container:hover,
        .metar-container:hover iframe,
        .metar-container:hover *,
        .metar-container:hover div,
        .metar-container:hover a,
        .metar-container *:hover {
            filter: none !important;
            opacity: 1 !important;
            transform: none !important;
            background: transparent !important;
            color: inherit !important;
            transition: none !important;
            text-decoration: none !important;
            cursor: default !important;
            pointer-events: none !important;
        }

        @media (max-width: 1600px) {
            .dashboard-container {
                grid-template-columns: 25% 40% 35%;
            }
        }

        @media (max-width: 1200px) {
            .dashboard-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto auto;
            }

            .weather-panel,
            .map-panel,
            .flights-panel {
                border: none;
                padding: 20px;
            }

            .flights-panel {
                grid-column: 1;
                grid-row: 1;
                border-bottom: 1px solid var(--gray-200-alpha);
            }

            .map-panel {
                grid-column: 1;
                grid-row: 2;
                border-bottom: 1px solid var(--gray-200-alpha);
            }

            .weather-panel {
                grid-column: 1;
                grid-row: 3;
            }
        }

        @media (max-width: 768px) {
            .main-section {
                height: auto;
                min-height: 100vh;
            }

            .dashboard-container {
                height: auto;
            }

            .weather-panel,
            .map-panel,
            .flights-panel {
                padding: 15px;
                height: auto;
            }

            .flights-panel {
                min-height: 400px;
            }

            .map-container {
                height: 400px;
            }

            .metar-container {
                height: 500px;
            }

            .metar-container a,
            .metar-container iframe {
                max-width: 280px !important;
            }

            .flight-row {
                padding: 16px;
            }

            .flight-header {
                gap: 12px;
            }

            .flight-photo {
                width: 80px;
                height: 60px;
            }

            .flight-number {
                font-size: 1.3em;
            }

            .flight-airline {
                font-size: 0.8em;
            }

            .airport-code {
                font-size: 1.1em;
            }

            .airport-city {
                font-size: 0.7em;
            }

            .flight-times {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .time-label {
                font-size: 0.65em;
            }

            .time-value {
                font-size: 0.85em;
            }

            .footer {
                padding: 12px 20px;
                height: 60px;
            }

            .footer-update-label {
                font-size: 0.65em;
            }

            .footer-update-time {
                font-size: 0.75em;
            }

            .upcoming-container {
                max-height: 400px;
            }

            .upcoming-row {
                padding: 10px 12px;
            }

            .upcoming-flight-number {
                font-size: 1em;
            }

            .upcoming-route {
                font-size: 0.7em;
            }

            .upcoming-eta {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="main-section">
        <div class="dashboard-container">
            <div class="weather-panel">
                <div class="column">
                    <h2 class="section-title">Weather (EDDL)</h2>
                    <div class="metar-container">
                        <div id="metartaf-VWtmRhzL" style="font-size:18px; font-weight:500; color:#000; width:100%; height:100%; max-width:320px; display:block; pointer-events:none;">METAR Düsseldorf Airport</div>
                        <script async defer crossorigin="anonymous" src="https://metar-taf.com/embed-js/EDDL?qnh=hPa&rh=rh&target=VWtmRhzL"></script>
                    </div>
                    <h2 class="section-title" style="margin-top: 30px;">Active Runway</h2>
                    <div id="runway-display" style="text-align: center; padding: 20px;">
                        <div style="color: var(--white-semi); font-size: 0.9em;">Loading runway info...</div>
                    </div>
                </div>
            </div>

            <div class="map-panel">
                <h2 class="section-title">Live Map</h2>
                <div class="map-container">
                    <iframe src="https://www.flightradar24.com/simple_index.php?lat=51.305&lon=6.825&z=13" allowfullscreen></iframe>
                    <div class="map-badges-blocker"></div>
                </div>
            </div>

            <div class="flights-panel">
                <div class="column">
                    <h2 class="section-title">Visible Planes</h2>
                    <div class="flights-container" id="flights-container">
                    </div>
                    <h2 class="section-title" style="margin-top: 20px;">Upcoming</h2>
                    <div class="upcoming-container" id="upcoming-container">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-update">
            <div class="footer-update-label">Last Updated</div>
            <div class="footer-update-time" id="global-last-update">Initializing...</div>
        </div>
    </footer>

    <script>
        console.log('%c skITQ ', 'background: #0f172a; color: #ff6b35; padding: 6px 12px; border-radius: 4px; font-weight: bold; font-family: Inter');
        console.log('🛩️ Real-Time Aviation Intelligence');

        // ===== CONSTANTS =====
        const USE_LOCAL_API = true; // Set to true to use local FlightRadarAPI backend
        const LOCAL_API_BASE = 'http://localhost:3000/api';
        const CORS_PROXY = 'https://corsproxy.io/?';
        const API_URLS = {
            // Local backend endpoints
            localFlights: (north, south, west, east) => `${LOCAL_API_BASE}/flights?north=${north}&south=${south}&west=${west}&east=${east}`,
            localFlightDetails: (flightId) => `${LOCAL_API_BASE}/flight/${flightId}`,
            // Fallback direct endpoints (with CORS proxy)
            fr24Feed: (bounds) => `https://data-cloud.flightradar24.com/zones/fcgi/feed.js?bounds=${bounds}&faa=1&satellite=1&mlat=1&flarm=1&adsb=1&gnd=1&air=1&vehicles=0&estimated=1&maxage=14400&gliders=0&stats=0`,
            fr24Details: (flightId) => `https://data-live.flightradar24.com/clickhandler/?flight=${flightId}`,
            planespotters: (registration) => `https://api.planespotters.net/pub/photos/reg/${registration}`,
            atis: 'https://atis.guru/atis/EDDL'
        };
        const REFRESH_INTERVAL = 60000; // 60 seconds
        const ATIS_REFRESH_INTERVAL = 300000; // 5 minutes
        const VIEW_BOUNDS = {
            north: 51.320, south: 51.290, west: 6.750, east: 6.900
        };
        const SEARCH_BOUNDS = {
            north: VIEW_BOUNDS.north + 0.09,
            south: VIEW_BOUNDS.south - 0.09,
            west: VIEW_BOUNDS.west - 0.12,
            east: VIEW_BOUNDS.east + 0.12
        };

        // ===== UTILITY FUNCTIONS =====
        // Format timestamp to HH:MM
        function formatTime(timestamp) {
            if (!timestamp) return '';
            return new Date(timestamp * 1000).toLocaleTimeString('en-US', {
                hour: '2-digit', minute: '2-digit', hour12: false
            });
        }

        // Fetch with CORS proxy
        async function fetchWithProxy(url, options = {}) {
            const proxyUrl = CORS_PROXY + encodeURIComponent(url);
            return fetch(proxyUrl, options);
        }

        // Check if flight is DUS arrival based on runway
        function isDUSArrival(flight) {
            return flight.destination_iata === 'DUS';
        }

        // Check if flight is DUS departure based on runway
        function isDUSDeparture(flight) {
            return flight.origin_iata === 'DUS';
        }

        // Check if we should show this flight based on runway configuration
        function shouldShowFlight(flight) {
            const isArrival = isDUSArrival(flight);
            const isDeparture = isDUSDeparture(flight);

            // Check if runway 23 is active for arrivals
            const runway23Active = activeRunways.arrivals.some(rwy => rwy.startsWith('23'));
            // Check if runway 05 is active for departures
            const runway05Active = activeRunways.departures.some(rwy => rwy.startsWith('05'));

            // If no ATIS data, show all DUS flights
            if (activeRunways.arrivals.length === 0 && activeRunways.departures.length === 0) {
                return isArrival || isDeparture;
            }

            // Show arrivals if runway 23 is active
            if (isArrival && runway23Active) {
                return true;
            }

            // Show departures if runway 05 is active
            if (isDeparture && runway05Active) {
                return true;
            }

            return false;
        }

        // Get country flag emoji
        function getCountryFlag(countryName) {
            const countryFlags = {
                'Germany': '🇩🇪', 'France': '🇫🇷', 'Spain': '🇪🇸', 'Italy': '🇮🇹',
                'United Kingdom': '🇬🇧', 'Netherlands': '🇳🇱', 'Belgium': '🇧🇪',
                'Switzerland': '🇨🇭', 'Austria': '🇦🇹', 'Portugal': '🇵🇹',
                'Greece': '🇬🇷', 'Poland': '🇵🇱', 'Turkey': '🇹🇷', 'Türkiye': '🇹🇷',
                'United States': '🇺🇸', 'Canada': '🇨🇦',
                'United Arab Emirates': '🇦🇪', 'Qatar': '🇶🇦', 'Saudi Arabia': '🇸🇦',

        // Check if plane is in viewing area
        function isInViewingArea(lat, lon) {
            return lat >= VIEW_BOUNDS.south && lat <= VIEW_BOUNDS.north &&
                   lon >= VIEW_BOUNDS.west && lon <= VIEW_BOUNDS.east;
        }

        // Calculate distance in km between two coordinates
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                     Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                     Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Check if plane is heading towards viewing area based on heading and position
        function isHeadingTowardsViewingArea(lat, lon, heading) {
            const centerLat = (VIEW_BOUNDS.north + VIEW_BOUNDS.south) / 2;
            const centerLon = (VIEW_BOUNDS.east + VIEW_BOUNDS.west) / 2;
            
            // Calculate bearing from plane to viewing area center
            const dLon = (centerLon - lon) * Math.PI / 180;
            const lat1 = lat * Math.PI / 180;
            const lat2 = centerLat * Math.PI / 180;
            
            const y = Math.sin(dLon) * Math.cos(lat2);
            const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
            const bearing = Math.atan2(y, x) * 180 / Math.PI;
            const normalizedBearing = (bearing + 360) % 360;
            
            // Normalize heading
            const normalizedHeading = (heading + 360) % 360;
            
            // Check if heading is roughly towards the viewing area (within 90 degrees for earlier detection)
            const headingDiff = Math.abs(normalizedHeading - normalizedBearing);
            const minDiff = Math.min(headingDiff, 360 - headingDiff);
            
            return minDiff < 90; // Within 90 degrees of correct direction (wider tolerance for earlier detection)
        }

        // Calculate ETA to viewing area center (only if heading towards it)
        function calculateETA(lat, lon, heading, groundSpeed) {
            // First check if plane is heading towards viewing area
            if (!isHeadingTowardsViewingArea(lat, lon, heading)) {
                return null;
            }
            
            const centerLat = (VIEW_BOUNDS.north + VIEW_BOUNDS.south) / 2;
            const centerLon = (VIEW_BOUNDS.east + VIEW_BOUNDS.west) / 2;

            const distance = calculateDistance(lat, lon, centerLat, centerLon);

            // Convert knots to km/h and calculate time in minutes
            const speedKmh = groundSpeed * 1.852;
            if (speedKmh === 0) return null;

            const timeHours = distance / speedKmh;
            const timeMinutes = Math.round(timeHours * 60);

            return timeMinutes > 0 && timeMinutes < 120 ? timeMinutes : null; // Extended to 120 minutes for earlier display
        }

        // Fetch live flights from FlightRadar24 API (via local backend or direct)
        async function fetchFlightRadar24Data() {
            try {
                let flights = [];

                if (USE_LOCAL_API) {
                    // Use local FlightRadarAPI backend
                    console.log(`Fetching flights from local API for expanded search area`);
                    const apiUrl = API_URLS.localFlights(
                        SEARCH_BOUNDS.north,
                        SEARCH_BOUNDS.south,
                        SEARCH_BOUNDS.west,
                        SEARCH_BOUNDS.east
                    );

                    try {
                        const response = await fetch(apiUrl);
                        if (response.ok) {
                            const data = await response.json();
                            flights = data.flights || [];
                            console.log(`Local API: Received ${flights.length} flights`);
                        } else {
                            console.warn('Local API returned error, falling back to direct API');
                            return await fetchFlightRadar24DataDirect();
                        }
                    } catch (err) {
                        console.warn('Local API unavailable, falling back to direct API:', err.message);
                        return await fetchFlightRadar24DataDirect();
                    }
                } else {
                    // Use direct API with CORS proxy
                    return await fetchFlightRadar24DataDirect();
                }

                // Filter flights based on runway configuration
                const filteredFlights = flights.filter(shouldShowFlight);
                const visibleFlights = [];
                const upcoming = [];
                const visibleFlightIds = new Set();

                filteredFlights.forEach(flight => {
                    if (isInViewingArea(flight.latitude, flight.longitude)) {
                        visibleFlights.push(flight);
                        visibleFlightIds.add(flight.id);
                    } else if (!flight.on_ground && !visibleFlightIds.has(flight.id)) {
                        // Calculate ETA for flights not in viewing area
                        const eta = calculateETA(flight.latitude, flight.longitude, flight.heading, flight.ground_speed);
                        if (eta !== null && eta < 120) {
                            flight.eta = eta;
                            upcoming.push(flight);
                        }
                    }
                });

                console.log(`FR24: Found ${visibleFlights.length} visible flights, ${upcoming.length} upcoming flights`);
                fr24FlightData = visibleFlights;
                upcomingFlightData = upcoming.sort((a, b) => a.eta - b.eta);
                lastFR24Fetch = Date.now();
                lastDataUpdateTime = Date.now();
                return visibleFlights;
            } catch (error) {
                console.error('Error fetching FR24 feed:', error);
                return [];
            }
        }

        // Direct API fetch (fallback method)
        async function fetchFlightRadar24DataDirect() {
            try {
                const bounds = `${SEARCH_BOUNDS.north},${SEARCH_BOUNDS.south},${SEARCH_BOUNDS.west},${SEARCH_BOUNDS.east}`;
                const apiUrl = API_URLS.fr24Feed(bounds);

                console.log(`Fetching FR24 feed data directly for expanded search area: ${bounds}`);
                const response = await fetchWithProxy(apiUrl);

                if (response.ok) {
                    const data = await response.json();
                    const flights = [];

                    // Parse FR24 data (each key is a flight, value is array)
                    for (const [key, value] of Object.entries(data)) {
                        // Skip metadata entries (only process numeric keys or flight IDs)
                        if (!Array.isArray(value) || value.length < 18) continue;

                        // Parse array according to FR24 format
                        const flightData = {
                            id: key,                      // Flight ID for details lookup
                            icao24: value[0],            // [0] ICAO 24-bit address
                            latitude: value[1],           // [1]
                            longitude: value[2],          // [2]
                            heading: value[3],            // [3]
                            altitude: value[4],           // [4]
                            ground_speed: value[5],       // [5]
                            squawk: value[6],             // [6]
                            aircraft_code: value[8],      // [8]
                            registration: value[9],       // [9] *** Aircraft registration ***
                            timestamp: value[10],         // [10]
                            origin_iata: value[11],       // [11] Origin airport IATA
                            destination_iata: value[12],  // [12] Destination airport IATA
                            flight_number: value[13],     // [13] Flight number
                            on_ground: value[14],         // [14]
                            vertical_speed: value[15],    // [15]
                            callsign: value[16],          // [16] Callsign
                            airline_icao: value[18]       // [18] Airline ICAO
                        };

                        flights.push(flightData);
                    }

                    return flights;
                }

                console.log('FR24: Failed to fetch feed data');
                return [];
            } catch (error) {
                console.error('Error fetching FR24 feed direct:', error);
                return [];
            }
        }

        // Fetch ATIS data to determine runway configuration
        async function fetchATIS() {
            try {
                const now = Date.now();
                if (now - lastATISFetch < ATIS_REFRESH_INTERVAL && lastATISFetch > 0) {
                    return activeRunways;
                }

                const response = await fetchWithProxy(API_URLS.atis);
                
                if (!response.ok) {
                    console.warn('ATIS fetch failed, using cached runway config');
                    return activeRunways;
                }
                
                const html = await response.text();
                const runwayInfo = {
                    arrivals: [],
                    departures: []
                };
                
                // Extract arrival ATIS section
                const arrivalMatch = html.match(/Arrival ATIS[\s\S]*?<div class="atis">([\s\S]*?)<\/div>/i);
                if (arrivalMatch) {
                    const arrivalAtis = arrivalMatch[1];
                    const rwyMatch = arrivalAtis.match(/RWY\s*(05[LR]?|23[LR]?)/i);
                    if (rwyMatch) {
                        runwayInfo.arrivals.push(rwyMatch[1].toUpperCase());
                    }
                }
                
                // Extract departure ATIS section
                const departureMatch = html.match(/Departure ATIS[\s\S]*?<div class="atis">([\s\S]*?)<\/div>/i);
                if (departureMatch) {
                    const departureAtis = departureMatch[1];
                    const rwyMatch = departureAtis.match(/RWY\s*(05[LR]?|23[LR]?)/i);
                    if (rwyMatch) {
                        runwayInfo.departures.push(rwyMatch[1].toUpperCase());
                    }
                }
                
                console.log('ATIS runway config:', runwayInfo);
                activeRunways = runwayInfo;
                lastATISFetch = Date.now();
                return runwayInfo;
            } catch (error) {
                console.error('Error fetching ATIS:', error);
                return activeRunways;
            }
        }

                        Runway ${runway}
                    </div>
                    <img src="${runwayImageUrl}" alt="Runway ${runway}" style="width: 100%; max-width: 250px; height: auto;" onerror="this.parentElement.innerHTML='<div style=\'color: var(--white-semi); padding: 20px;\'>Runway ${runway} in use</div>'">
                </div>
            `;
        }

        // Update timestamp display
        function updateTimestamp() {
            const updateElement = document.getElementById('global-last-update');
            if (updateElement) {
                if (lastDataUpdateTime > 0) {
                    // Format date and time (hh:mm:ss)
                    const updateDate = new Date(lastDataUpdateTime);
                    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    const month = months[updateDate.getMonth()];
                    const day = updateDate.getDate();
                    const year = updateDate.getFullYear();
                    const hours = String(updateDate.getHours()).padStart(2, '0');
                    const minutes = String(updateDate.getMinutes()).padStart(2, '0');
                    const seconds = String(updateDate.getSeconds()).padStart(2, '0');
                    updateElement.textContent = `Last updated: ${month} ${day}, ${year} at ${hours}:${minutes}:${seconds}`;
                } else {
                    const nowDate = new Date();
                    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    const month = months[nowDate.getMonth()];
                    const day = nowDate.getDate();
                    const year = nowDate.getFullYear();
                    const hours = String(nowDate.getHours()).padStart(2, '0');
                    const minutes = String(nowDate.getMinutes()).padStart(2, '0');
                    const seconds = String(nowDate.getSeconds()).padStart(2, '0');
                    updateElement.textContent = `Waiting for update... ${month} ${day}, ${year} at ${hours}:${minutes}:${seconds}`;
                }
            }
        }

        // Update and display flights
        async function updateAndDisplayFlights() {
            const now = Date.now();
            const shouldFetch = (now - lastFR24Fetch > REFRESH_INTERVAL || lastFR24Fetch === 0);

            if (shouldFetch) {
                console.log(`Fetching new flight data (last fetch: ${Math.floor((now - lastFR24Fetch) / 1000)}s ago)`);
                await fetchATIS(); // Fetch runway configuration first
                await fetchFlightRadar24Data();
                updateTimestamp();
            }

            await displayFlights();
            displayUpcomingFlights();
            displayRunway();
        }

        // Initial load
        updateAndDisplayFlights();

        // Refresh flight data and display every minute
        setInterval(() => {
            console.log('Scheduled update triggered');
            updateAndDisplayFlights();
        }, REFRESH_INTERVAL);
    </script>
</body>
</html>
