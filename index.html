<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>skITQ - Plane Spotter</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #0057a3;
            --dark-blue: #004080;
            --darker-blue: #003060;
            --navy-900: #0f172a;
            --navy-800: #1e293b;
            --navy-700: #334155;
            --charcoal: #1a1a1a;
            --orange: #ff6b35;
            --orange-hover: #ff5722;
            --white: #ffffff;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-200-alpha: rgba(226, 232, 240, 0.1);
            --gray-600: #475569;
            --gray-700: #334155;
            --white-semi: rgba(255, 255, 255, 0.6);

            /* Flight type colors */
            --arrival-green: #10b981;
            --arrival-green-glow: rgba(16, 185, 129, 0.3);
            --departure-amber: #f59e0b;
            --departure-amber-glow: rgba(245, 158, 11, 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--primary-blue);
            color: var(--white);
            padding: 0;
            height: 100vh;
            line-height: 1.6;
            overflow: hidden;
        }

        .app-header {
            background: var(--darker-blue);
            color: var(--white);
            padding: 20px 40px;
            height: 70px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--gray-200-alpha);
        }

        .app-title {
            font-size: 1.8em;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .main-section {
            padding: 0;
            background: var(--primary-blue);
            height: calc(100vh - 130px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 25% 40% 35%;
            grid-template-rows: auto 1fr;
            gap: 0;
            height: 100%;
            width: 100%;
        }

        .weather-panel {
            grid-column: 1;
            grid-row: 1 / 3;
            background: var(--primary-blue);
            padding: 30px;
            overflow: hidden;
            border-right: 1px solid var(--gray-200-alpha);
        }

        .map-panel {
            grid-column: 2;
            grid-row: 1 / 3;
            background: var(--primary-blue);
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .flights-panel {
            grid-column: 3;
            grid-row: 1 / 3;
            background: var(--primary-blue);
            padding: 30px;
            overflow: hidden;
            border-left: 1px solid var(--gray-200-alpha);
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }

        .section-title {
            font-size: 1.8em;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 20px;
            letter-spacing: -0.8px;
            padding-bottom: 0;
            border-bottom: none;
            flex-shrink: 0;
        }

        .flights-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            flex: 1;
            padding-right: 8px;
            min-height: 0;
        }

        .flights-container::-webkit-scrollbar {
            width: 8px;
        }

        .flights-container::-webkit-scrollbar-track {
            background: var(--dark-blue);
            border-radius: 4px;
        }

        .flights-container::-webkit-scrollbar-thumb {
            background: var(--white-semi);
            border-radius: 4px;
        }

        .flights-container::-webkit-scrollbar-thumb:hover {
            background: var(--white);
        }

        .upcoming-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .upcoming-container::-webkit-scrollbar {
            width: 6px;
        }

        .upcoming-container::-webkit-scrollbar-track {
            background: var(--dark-blue);
            border-radius: 4px;
        }

        .upcoming-container::-webkit-scrollbar-thumb {
            background: var(--white-semi);
            border-radius: 4px;
        }

        .upcoming-row {
            background: rgba(0, 0, 0, 0.15);
            padding: 16px 18px;
            min-height: 65px;
            border-radius: 6px;
            border-left: 3px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s ease;
            cursor: pointer;
        }

        .upcoming-row.arrival {
            border-left-color: var(--arrival-green);
        }

        .upcoming-row.departure {
            border-left-color: var(--departure-amber);
        }

        .upcoming-row:hover {
            background: rgba(0, 0, 0, 0.25);
        }

        .upcoming-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .upcoming-flight-number {
            font-size: 1.2em;
            font-weight: 700;
            color: var(--white);
            line-height: 1.2;
        }

        .upcoming-route {
            font-size: 0.85em;
            color: var(--white-semi);
            line-height: 1.3;
        }

        .upcoming-eta {
            font-size: 1.4em;
            font-weight: 700;
            color: var(--white);
            text-align: right;
            line-height: 1.1;
        }

        .flight-row {
            background: rgba(0, 0, 0, 0.2);
            padding: 18px;
            border-radius: 8px;
            transition: background 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 14px;
            border-left: 3px solid transparent;
            position: relative;
        }

        .flight-row.arriving {
            border-left-color: var(--arrival-green);
        }

        .flight-row.departing {
            border-left-color: var(--departure-amber);
        }

        .flight-row:hover {
            background: rgba(0, 0, 0, 0.3);
        }

        .flight-header {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .flight-photo {
            width: 100px;
            height: 75px;
            object-fit: contain;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            border: 1px solid var(--gray-200-alpha);
            flex-shrink: 0;
        }

        .flight-photo img {
            object-fit: contain !important;
        }

        .flight-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .flight-number {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--white);
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .flight-airline {
            font-size: 0.8em;
            color: var(--white-semi);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .flight-aircraft {
            font-size: 0.75em;
            color: var(--white-semi);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .flight-aircraft-type {
            color: var(--white);
            font-weight: 600;
            margin-left: 4px;
        }

        .flight-details {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--gray-200-alpha);
        }

        .flight-airports {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid rgba(255, 255, 255, 0.15);
            position: relative;
        }

        .origin-label {
            font-size: 0.7em;
            color: var(--white-semi);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .airport-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .airport-flag {
            font-size: 3em;
            line-height: 1;
            flex-shrink: 0;
        }

        .airport-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            flex: 1;
        }

        .airport-city {
            font-size: 1em;
            color: var(--white);
            font-weight: 700;
            line-height: 1.2;
        }

        .airport-country {
            font-size: 0.85em;
            color: var(--white-semi);
            font-weight: 500;
        }

        .airport-code {
            font-size: 0.75em;
            font-weight: 500;
            color: var(--white-semi);
            letter-spacing: 0.3px;
            line-height: 1.3;
        }

        .flight-times {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }

        .time-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(0, 0, 0, 0.15);
            padding: 8px 10px;
            border-radius: 4px;
        }

        .time-label {
            font-size: 0.7em;
            color: var(--white-semi);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            font-weight: 600;
            line-height: 1.2;
            white-space: nowrap;
        }

        .time-value {
            font-size: 1em;
            color: var(--white);
            font-weight: 700;
            line-height: 1;
        }
        
        .time-value.crossed-out {
            text-decoration: line-through;
            opacity: 0.6;
            color: var(--white-semi);
        }
        
        .merged-time-block {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }
        
        .time-value-container {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .footer {
            background: var(--darker-blue);
            color: var(--white);
            padding: 16px 40px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-top: 1px solid var(--gray-200-alpha);
        }

        .footer-update {
            text-align: center;
        }

        .footer-update-label {
            font-size: 0.7em;
            color: var(--white-semi);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .footer-update-time {
            font-size: 0.85em;
            color: var(--white);
            font-weight: 600;
        }

        .no-flights {
            text-align: center;
            padding: 60px 30px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            border: 2px dashed var(--gray-200-alpha);
        }

        .plane-icon {
            font-size: 3em;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .no-flights-title {
            font-size: 1.3em;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 8px;
        }

        .no-flights-text {
            font-size: 0.9em;
            color: var(--white-semi);
        }

        .map-container {
            width: 100%;
            flex: 1;
            border-radius: 0;
            overflow: hidden;
            border: none;
            background: var(--dark-blue);
            position: relative;
            box-shadow: none;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Block FlightRadar24 app store badges with overlay */
        .map-badges-blocker {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 120px;
            background: var(--primary-blue);
            z-index: 100;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 20px;
        }

        .map-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .map-stat-value {
            font-size: 2em;
            font-weight: 700;
            color: var(--white);
            line-height: 1;
        }

        .map-stat-label {
            font-size: 0.75em;
            color: var(--white-semi);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .metar-container {
            width: 100%;
            flex: 1;
            position: relative;
            background: transparent !important;
            border-radius: 0;
            overflow: visible;
            border: none;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none !important;
        }

        .metar-container,
        .metar-container *,
        .metar-container a,
        .metar-container iframe,
        .metar-container div,
        .metar-container span,
        .metar-container p {
            pointer-events: none !important;
            cursor: default !important;
        }

        .metar-container a {
            text-decoration: none !important;
            cursor: default !important;
            pointer-events: none !important;
            color: #000 !important;
        }

        .metar-container iframe {
            width: 100% !important;
            height: 100% !important;
            max-width: 320px !important;
            border: 0;
            pointer-events: none !important;
            cursor: default !important;
        }

        /* Prevent any hover effects on METAR widget and all children */
        .metar-container:hover,
        .metar-container:hover *,
        .metar-container:hover iframe,
        .metar-container:hover a,
        .metar-container:hover div,
        .metar-container:hover span,
        .metar-container *:hover,
        .metar-container iframe:hover,
        .metar-container a:hover,
        .metar-container div:hover,
        .metar-container span:hover {
            filter: none !important;
            opacity: 1 !important;
            transform: none !important;
            background: transparent !important;
            background-color: transparent !important;
            color: inherit !important;
            transition: none !important;
            text-decoration: none !important;
            cursor: default !important;
            pointer-events: none !important;
            box-shadow: none !important;
            border: none !important;
            outline: none !important;
        }

        @media (max-width: 1600px) {
            .dashboard-container {
                grid-template-columns: 25% 40% 35%;
            }
        }

        @media (max-width: 1200px) {
            .dashboard-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto auto;
            }

            .weather-panel,
            .map-panel,
            .flights-panel {
                border: none;
                padding: 20px;
            }

            .flights-panel {
                grid-column: 1;
                grid-row: 1;
                border-bottom: 1px solid var(--gray-200-alpha);
            }

            .map-panel {
                grid-column: 1;
                grid-row: 2;
                border-bottom: 1px solid var(--gray-200-alpha);
            }

            .weather-panel {
                grid-column: 1;
                grid-row: 3;
            }
        }

        @media (max-width: 768px) {
            body {
                overflow-y: auto;
                height: auto;
            }

            .main-section {
                height: auto;
                min-height: 100vh;
            }

            .dashboard-container {
                height: auto;
            }

            .weather-panel,
            .map-panel,
            .flights-panel {
                padding: 15px;
                height: auto;
            }

            .flights-panel {
                min-height: 400px;
            }

            .map-panel {
                min-height: 60vh;
                display: flex;
                flex-direction: column;
            }

            .map-container {
                flex: 1;
                min-height: 500px;
            }

            .map-badges-blocker {
                height: 70px;
                gap: 15px;
                padding: 10px;
            }

            .map-stat-value {
                font-size: 1.3em;
            }

            .map-stat-label {
                font-size: 0.6em;
            }

            .metar-container {
                height: 500px;
            }

            .metar-container a,
            .metar-container iframe {
                max-width: 280px !important;
            }

            .flight-row {
                padding: 16px;
            }

            .flight-header {
                gap: 12px;
            }

            .flight-photo {
                width: 80px;
                height: 60px;
            }

            .flight-number {
                font-size: 1.3em;
            }

            .flight-airline {
                font-size: 0.8em;
            }

            .airport-flag {
                font-size: 2.5em;
            }

            .airport-city {
                font-size: 0.9em;
            }

            .airport-country {
                font-size: 0.75em;
            }

            .airport-code {
                font-size: 0.7em;
            }

            .flight-times,
            .flight-airports {
                width: 100%;
            }

            .flight-times {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .merged-time-block {
                grid-template-columns: 1fr 1fr;
                width: 100%;
            }

            .time-label {
                font-size: 0.65em;
            }

            .time-value {
                font-size: 0.85em;
            }

            .footer {
                padding: 12px 20px;
                height: 60px;
            }

            .footer-update-label {
                font-size: 0.65em;
            }

            .footer-update-time {
                font-size: 0.75em;
            }

            .upcoming-container {
                max-height: 400px;
            }

            .upcoming-row {
                padding: 10px 12px;
            }

            .upcoming-flight-number {
                font-size: 1em;
            }

            .upcoming-route {
                font-size: 0.7em;
            }

            .upcoming-eta {
                font-size: 1.1em;
            }
        }

        /* Landscape mode fixes for mobile/tablets */
        @media (max-width: 1024px) and (orientation: landscape) {
            body {
                overflow-y: auto;
                height: auto;
            }

            .main-section {
                height: auto;
                min-height: 100vh;
            }

            .dashboard-container {
                height: auto;
                min-height: 100vh;
            }

            .weather-panel,
            .map-panel,
            .flights-panel {
                height: auto;
                min-height: 50vh;
            }

            .map-container {
                min-height: 400px;
            }

            .metar-container {
                min-height: 300px;
            }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <h1 class="app-title">skITQ - Plane Spotter</h1>
    </header>
    <div class="main-section">
        <div class="dashboard-container">
            <div class="weather-panel">
                <div class="column">
                    <h2 class="section-title">Weather</h2>
                    <div class="metar-container" style="position: relative;">
                        <a id="metartaf-VWtmRhzL" style="font-size:18px; font-weight:500; color:#000; width:100%; height:100%; max-width:320px; display:block; pointer-events: none;">METAR Düsseldorf Airport</a>
                        <script async defer crossorigin="anonymous" src="https://metar-taf.com/embed-js/EDDL?qnh=hPa&rh=rh&target=VWtmRhzL"></script>
                        <!-- Transparent overlay to block all mouse events -->
                        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000; background: transparent; cursor: default;"></div>
                    </div>
                    <div id="runway-display" style="text-align: center; padding: 20px; margin-top: 30px;">
                        <div style="color: var(--white-semi); font-size: 0.9em;">Loading runway info...</div>
                    </div>
                </div>
            </div>

            <div class="map-panel">
                <h2 class="section-title" style="cursor: pointer;" onclick="resetMap()">Live Map</h2>
                <div class="map-container">
                    <iframe id="map-iframe" src="https://www.flightradar24.com/simple_index.php?lat=51.305&lon=6.825&z=13" allowfullscreen></iframe>
                    <div class="map-badges-blocker" onclick="resetMap()" style="cursor: pointer;">
                        <div class="map-stat">
                            <div class="map-stat-value" id="visible-count">0</div>
                            <div class="map-stat-label">Visible</div>
                        </div>
                        <div class="map-stat">
                            <div class="map-stat-value" id="upcoming-count">0</div>
                            <div class="map-stat-label">Upcoming</div>
                        </div>
                        <div class="map-stat">
                            <div class="map-stat-value" id="next-arrival">--</div>
                            <div class="map-stat-label">Next (min)</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flights-panel">
                <div class="column">
                    <h2 class="section-title">Visible Planes</h2>
                    <div class="flights-container" id="flights-container">
                    </div>
                    <h2 class="section-title" id="upcoming-title" style="margin-top: 20px;">Upcoming</h2>
                    <div class="upcoming-container" id="upcoming-container">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-update">
            <div class="footer-update-label">Last Updated</div>
            <div class="footer-update-time" id="global-last-update">Initializing...</div>
        </div>
    </footer>

    <script>
        console.log('%c skITQ ', 'background: #0f172a; color: #ff6b35; padding: 6px 12px; border-radius: 4px; font-weight: bold; font-family: Inter');

        // ===== CONSTANTS =====
        const USE_LOCAL_API = false; // Set to true only if running backend locally (npm start)
        const LOCAL_API_BASE = 'http://localhost:3000/api';
        const CORS_PROXY = 'https://corsproxy.io/?';
        const API_URLS = {
            // FlightRadarAPI backend endpoints (only used if USE_LOCAL_API = true)
            localFlights: (north, south, west, east) => `${LOCAL_API_BASE}/flights?north=${north}&south=${south}&west=${west}&east=${east}`,
            localFlightDetails: (flightId) => `${LOCAL_API_BASE}/flight/${flightId}`,
            localAirport: (iata) => `${LOCAL_API_BASE}/airport/${iata}`,
            // Direct FlightRadar24 API endpoints (work on GitHub Pages via CORS proxy)
            fr24Feed: (bounds) => `https://data-cloud.flightradar24.com/zones/fcgi/feed.js?bounds=${bounds}&faa=1&satellite=1&mlat=1&flarm=1&adsb=1&gnd=1&air=1&vehicles=0&estimated=1&maxage=14400&gliders=0&stats=0`,
            fr24Details: (flightId) => `https://data-live.flightradar24.com/clickhandler/?flight=${flightId}`,
            fr24Airport: (iata) => `https://api.flightradar24.com/common/v1/airport.json?code=${iata}&plugin[]=schedule&plugin[]=details&limit=100&page=1`,
            // Other APIs
            planespotters: (registration) => `https://api.planespotters.net/pub/photos/reg/${registration}`,
            atis: 'https://atis.guru/atis/EDDL'
        };
        const REFRESH_INTERVAL_FAST = 15000; // 15 seconds when planes are nearby
        const REFRESH_INTERVAL_NORMAL = 30000; // 30 seconds when moderate activity
        const REFRESH_INTERVAL_SLOW = 60000; // 60 seconds when no activity
        const ATIS_REFRESH_INTERVAL = 300000; // 5 minutes
        let currentRefreshInterval = REFRESH_INTERVAL_NORMAL;
        const VIEW_BOUNDS = {
            // Tighter bounds to show planes closer to airport
            // Center: 51.305, 6.825
            north: 51.340, south: 51.270, west: 6.730, east: 6.920
        };
        const SEARCH_BOUNDS = {
            north: VIEW_BOUNDS.north + 0.09,
            south: VIEW_BOUNDS.south - 0.09,
            west: VIEW_BOUNDS.west - 0.12,
            east: VIEW_BOUNDS.east + 0.12
        };

        // ===== UTILITY FUNCTIONS =====
        // Format timestamp to HH:MM
        function formatTime(timestamp) {
            if (!timestamp) return '';
            return new Date(timestamp * 1000).toLocaleTimeString('en-US', {
                hour: '2-digit', minute: '2-digit', hour12: false
            });
        }

        // Fetch with CORS proxy
        async function fetchWithProxy(url, options = {}) {
            const proxyUrl = CORS_PROXY + encodeURIComponent(url);
            return fetch(proxyUrl, options);
        }

        // Check if flight is DUS arrival based on runway
        function isDUSArrival(flight) {
            return flight.destination_iata === 'DUS';
        }

        // Check if flight is DUS departure based on runway
        function isDUSDeparture(flight) {
            return flight.origin_iata === 'DUS';
        }

        // Check if we should show this flight based on runway configuration
        function shouldShowFlight(flight) {
            const isArrival = isDUSArrival(flight);
            const isDeparture = isDUSDeparture(flight);

            // Check if any arrival or departure runway is active
            const hasArrivalRunway = activeRunways.arrivals.length > 0;
            const hasDepartureRunway = activeRunways.departures.length > 0;

            // If no ATIS data, show all DUS flights
            if (!hasArrivalRunway && !hasDepartureRunway) {
                return isArrival || isDeparture;
            }

            // Prioritize arrivals over departures when both runways are active
            // This ensures we only show ONE type at a time
            if (hasArrivalRunway) {
                // Only show arrivals when arrival runway is active
                return isArrival;
            } else if (hasDepartureRunway) {
                // Only show departures when only departure runway is active
                return isDeparture;
            }

            return false;
        }

        // Get country flag emoji
        function getCountryFlag(countryName) {
            const countryFlags = {

            };

        }

        // ===== STATE MANAGEMENT =====
        let fr24FlightData = [];
        let upcomingFlightData = [];
        let lastFR24Fetch = 0;
        let lastDataUpdateTime = 0;
        let activeRunways = { arrivals: [], departures: [] };
        let lastATISFetch = 0;
        let dusUpcomingFlights = [];
        let enrichedFlightCache = new Map(); // Cache for flight details to avoid re-fetching

        // Check if plane is in viewing area
        function isInViewingArea(lat, lon) {
            return lat >= VIEW_BOUNDS.south && lat <= VIEW_BOUNDS.north &&
                   lon >= VIEW_BOUNDS.west && lon <= VIEW_BOUNDS.east;
        }

        // Calculate distance in km between two coordinates
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                     Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                     Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Check if plane is heading towards viewing area based on heading and position
        function isHeadingTowardsViewingArea(lat, lon, heading) {
            const centerLat = (VIEW_BOUNDS.north + VIEW_BOUNDS.south) / 2;
            const centerLon = (VIEW_BOUNDS.east + VIEW_BOUNDS.west) / 2;
            
            // Calculate bearing from plane to viewing area center
            const dLon = (centerLon - lon) * Math.PI / 180;
            const lat1 = lat * Math.PI / 180;
            const lat2 = centerLat * Math.PI / 180;
            
            const y = Math.sin(dLon) * Math.cos(lat2);
            const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
            const bearing = Math.atan2(y, x) * 180 / Math.PI;
            const normalizedBearing = (bearing + 360) % 360;
            
            // Normalize heading
            const normalizedHeading = (heading + 360) % 360;
            
            // Check if heading is roughly towards the viewing area (within 90 degrees for earlier detection)
            const headingDiff = Math.abs(normalizedHeading - normalizedBearing);
            const minDiff = Math.min(headingDiff, 360 - headingDiff);
            
            return minDiff < 90; // Within 90 degrees of correct direction (wider tolerance for earlier detection)
        }

        // Calculate ETA to viewing area center (only if heading towards it)
        function calculateETA(lat, lon, heading, groundSpeed) {
            // First check if plane is heading towards viewing area
            if (!isHeadingTowardsViewingArea(lat, lon, heading)) {
                return null;
            }
            
            const centerLat = (VIEW_BOUNDS.north + VIEW_BOUNDS.south) / 2;
            const centerLon = (VIEW_BOUNDS.east + VIEW_BOUNDS.west) / 2;

            const distance = calculateDistance(lat, lon, centerLat, centerLon);

            // Convert knots to km/h and calculate time in minutes
            const speedKmh = groundSpeed * 1.852;
            if (speedKmh === 0) return null;

            const timeHours = distance / speedKmh;
            const timeMinutes = Math.round(timeHours * 60);

            return timeMinutes > 0 && timeMinutes < 120 ? timeMinutes : null; // Extended to 120 minutes for earlier display
        }

        // Fetch live flights from FlightRadar24 API (backend or direct)
        async function fetchFlightRadar24Data() {
            try {
                let flights = [];

                if (USE_LOCAL_API) {
                    // Use local backend
                    try {
                        const apiUrl = API_URLS.localFlights(
                            SEARCH_BOUNDS.north,
                            SEARCH_BOUNDS.south,
                            SEARCH_BOUNDS.west,
                            SEARCH_BOUNDS.east
                        );

                        const response = await fetch(apiUrl);
                        if (response.ok) {
                            const data = await response.json();
                            flights = data.flights || [];
                        } else {
                            console.warn('Backend unavailable, using direct FR24 API');
                            flights = await fetchFlightRadar24DataDirect();
                        }
                    } catch (err) {
                        console.warn('Backend unavailable, using direct FR24 API');
                        flights = await fetchFlightRadar24DataDirect();
                    }
                } else {
                    // Use direct FR24 API
                    flights = await fetchFlightRadar24DataDirect();
                }

                // Filter flights based on runway configuration
                const filteredFlights = flights.filter(shouldShowFlight);
                const visibleFlights = [];
                const upcoming = [];
                const visibleFlightIds = new Set();

                filteredFlights.forEach(flight => {
                    if (isInViewingArea(flight.latitude, flight.longitude)) {
                        visibleFlights.push(flight);
                        visibleFlightIds.add(flight.id);
                    } else if (!flight.on_ground && !visibleFlightIds.has(flight.id)) {
                        // Calculate ETA for flights not in viewing area
                        const eta = calculateETA(flight.latitude, flight.longitude, flight.heading, flight.ground_speed);
                        if (eta !== null && eta < 120) {
                            flight.eta = eta;
                            upcoming.push(flight);
                        }
                    }
                });

                fr24FlightData = visibleFlights;
                upcomingFlightData = upcoming.sort((a, b) => a.eta - b.eta);
                lastFR24Fetch = Date.now();
                lastDataUpdateTime = Date.now();
                return visibleFlights;
            } catch (error) {
                console.error('Error fetching FR24 feed:', error);
                return [];
            }
        }

        // Direct API fetch for flights (fallback or primary for GitHub Pages)
        async function fetchFlightRadar24DataDirect() {
            try {
                const bounds = `${SEARCH_BOUNDS.north},${SEARCH_BOUNDS.south},${SEARCH_BOUNDS.west},${SEARCH_BOUNDS.east}`;
                const apiUrl = API_URLS.fr24Feed(bounds);

                const response = await fetchWithProxy(apiUrl);

                if (response.ok) {
                    const data = await response.json();
                    const flights = [];

                    // Parse FR24 data (each key is a flight, value is array)
                    for (const [key, value] of Object.entries(data)) {
                        if (!Array.isArray(value) || value.length < 18) continue;

                        const flightData = {
                            id: key,
                            icao24: value[0],
                            latitude: value[1],
                            longitude: value[2],
                            heading: value[3],
                            altitude: value[4],
                            ground_speed: value[5],
                            squawk: value[6],
                            aircraft_code: value[8],
                            registration: value[9],
                            timestamp: value[10],
                            origin_iata: value[11],
                            destination_iata: value[12],
                            flight_number: value[13],
                            on_ground: value[14],
                            vertical_speed: value[15],
                            callsign: value[16],
                            airline_icao: value[18]
                        };

                        flights.push(flightData);
                    }

                    return flights;
                }

                return [];
            } catch (error) {
                console.error('Error fetching FR24 feed direct:', error);
                return [];
            }
        }

        // Fetch detailed flight information from FlightRadarAPI backend or direct
        async function fetchFlightDetails(flightId) {
            try {
                if (USE_LOCAL_API) {
                    try {
                        const response = await fetch(API_URLS.localFlightDetails(flightId));
                        if (response.ok) {
                            const data = await response.json();
                            return data.flight || null;
                        }
                    } catch (err) {
                        console.warn('Backend unavailable for flight details, using direct API');
                    }

                // Fallback to direct API
                const response = await fetchWithProxy(API_URLS.fr24Details(flightId));
                return response.ok ? await response.json() : null;

                return null;
            }
        }

        // Fetch aircraft photo from Planespotters API
        async function fetchAircraftPhoto(registration) {
            if (!registration) return null;
            try {
                const response = await fetchWithProxy(API_URLS.planespotters(registration));
                if (response.ok) {
                    const data = await response.json();
                    if (data?.photos?.length > 0) {
                        const photoUrl = data.photos[0].thumbnail_large?.src || data.photos[0].thumbnail?.src;
                        return photoUrl;
                    }
