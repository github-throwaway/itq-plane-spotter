        // Update flight details cache and display
        // Display flights from FR24 data
        async function displayFlights() {
            const container = document.getElementById('flights-container');

            // Update timestamp regardless of flight data
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            const dateStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            document.getElementById('global-last-update').textContent = `${dateStr} at ${timeStr}`;

            if (!fr24FlightData || fr24FlightData.length === 0) {
                container.innerHTML = `
                    <div class="no-flights">
                        <div class="plane-icon">✈️</div>
                        <div class="no-flights-title">No Visible Planes</div>
                    </div>
                `;

                // Update map stats even when no flights
                document.getElementById('visible-count').textContent = '0';
                document.getElementById('upcoming-count').textContent = dusUpcomingFlights?.length || 0;
                if (dusUpcomingFlights?.length > 0 && dusUpcomingFlights[0].eta !== undefined) {
                    document.getElementById('next-arrival').textContent = dusUpcomingFlights[0].eta;
                } else {
                    document.getElementById('next-arrival').textContent = '--';
                }

                return;
            }

            // Filter to only DUS flights that are in the viewing area and exclude landed planes
            const dusOnlyFlights = fr24FlightData.filter(flight => {
                const isArrival = isDUSArrival(flight);
                const isDeparture = isDUSDeparture(flight);

                // Must be a DUS flight
                if (!isArrival && !isDeparture) {
                    return false;
                }

                // If it's an arrival to DUS and on the ground, it has landed - don't show it
                if (isArrival && flight.on_ground) {
                    return false;
                }

                // MUST be in the viewing area to show in visible planes
                if (!isInViewingArea(flight.latitude, flight.longitude)) {
                    return false;
                }

                return true;
            });

            if (upcomingFlightData?.length > 0) {
                upcomingFlightData.forEach(upcomingFlight => {
                    if (isInViewingArea(upcomingFlight.latitude, upcomingFlight.longitude)) {
                        const alreadyVisible = dusOnlyFlights.some(visibleFlight =>
                            visibleFlight.id === upcomingFlight.id ||
                            (visibleFlight.flight_number === upcomingFlight.flight_number &&
                             visibleFlight.origin_iata === upcomingFlight.origin_iata &&
                             visibleFlight.destination_iata === upcomingFlight.destination_iata)
                        );

                        // Don't add if already visible, or if it's an arrival that has landed
                        const isLandedArrival = isDUSArrival(upcomingFlight) && upcomingFlight.on_ground;

                        if (!alreadyVisible && !isLandedArrival && (isDUSArrival(upcomingFlight) || isDUSDeparture(upcomingFlight))) {
                            dusOnlyFlights.push(upcomingFlight);
                        }
                    }
                });
            }

            // Get current flight IDs for cache cleanup
            const currentFlightIds = new Set(dusOnlyFlights.map(f => f.id));

            // Clean up cache - remove flights no longer visible
            for (const [flightId, cachedData] of enrichedFlightCache.entries()) {
                if (!currentFlightIds.has(flightId)) {
                    enrichedFlightCache.delete(flightId);
                }
            }

            // Fetch details only for new flights, reuse cached data for existing ones
            const enrichedFlights = await Promise.all(
                dusOnlyFlights.map(async (flight) => {
                    // Check cache first
                    if (enrichedFlightCache.has(flight.id)) {
                        const cached = enrichedFlightCache.get(flight.id);
                        // Update position and speed from live data, keep enriched details
                        return {
                            ...cached,
                            latitude: flight.latitude,
                            longitude: flight.longitude,
                            heading: flight.heading,
                            altitude: flight.altitude,
                            ground_speed: flight.ground_speed,
                            on_ground: flight.on_ground,
                            vertical_speed: flight.vertical_speed
                        };
                    }

                    // Not in cache, fetch details
                    const details = await fetchFlightDetails(flight.id);

                    const enrichedFlight = {
                        ...flight,
                        details: details,
                        // Extract useful info from details
                        airline_name: details?.airline?.name || flight.airline_icao || '',
                        origin_name: details?.airport?.origin?.name || flight.origin_iata || '',
                        origin_city: details?.airport?.origin?.position?.region?.city || '',
                        origin_country: details?.airport?.origin?.position?.country?.name || '',
                        destination_name: details?.airport?.destination?.name || flight.destination_iata || '',
                        destination_city: details?.airport?.destination?.position?.region?.city || '',
                        destination_country: details?.airport?.destination?.position?.country?.name || '',
                        scheduled_time: details?.time?.scheduled?.departure || details?.time?.scheduled?.arrival || 0,
                        estimated_time: details?.time?.estimated?.departure || details?.time?.estimated?.arrival || 0,
                        status_text: details?.status?.text || ''
                    };

                    // Store in cache
                    enrichedFlightCache.set(flight.id, enrichedFlight);

                    return enrichedFlight;
                })
            );

            // Sort by scheduled time
            enrichedFlights.sort((a, b) => a.scheduled_time - b.scheduled_time);

            // Determine if arriving or departing based on destination
            const flightsHtml = enrichedFlights.map(flight => {
                const isArriving = flight.destination_iata === 'DUS' || flight.destination_name?.includes('Düsseldorf');
                const flightStatus = isArriving ? 'arriving' : 'departing';

                // Get comprehensive flight details
                const details = flight.details;
                const aircraftType = details?.aircraft?.model?.code || flight.aircraft_code || '';
                const registration = flight.registration || '';

                // Origin info
                const originCode = flight.origin_iata || '';
                const originCity = flight.origin_city || flight.origin_name || '';
                const originCountry = flight.origin_country || '';
                const originFlag = getCountryFlag(originCountry);

                // Destination info
                const destCode = flight.destination_iata || '';
                const destCity = flight.destination_city || flight.destination_name || '';
                const destCountry = flight.destination_country || '';
                const destFlag = getCountryFlag(destCountry);

                // Get time values
                const scheduledDep = details?.time?.scheduled?.departure || 0;
                const actualDep = details?.time?.real?.departure || 0;
                const scheduledArr = details?.time?.scheduled?.arrival || 0;
                const estimatedArr = details?.time?.estimated?.arrival || 0;

                const rowId = `flight-${flight.flight_number?.replace(/\s/g, '-') || flight.id}`;
                const photoId = `${rowId}-photo`;

                // Format live data
                const altitude = flight.altitude ? `${Math.round(flight.altitude).toLocaleString()} ft` : 'N/A';
                const speed = flight.ground_speed ? `${Math.round(flight.ground_speed)} kts` : 'N/A';

                return `
                    <div class="flight-row ${flightStatus}" id="${rowId}">
                        <div class="flight-header">
                            <div class="flight-photo" id="${photoId}">✈️</div>
                            <div class="flight-info">
                                ${flight.airline_name ? `<div class="flight-airline">${flight.airline_name}</div>` : ''}
                                <div class="flight-number">${flight.flight_number || flight.callsign || 'Unknown'}</div>
                                ${aircraftType || registration ? `
                                    <div class="flight-aircraft">
                                        ${registration ? `${registration}` : ''}
                                        ${aircraftType ? `<span class="flight-aircraft-type">${aircraftType}</span>` : ''}
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        <div class="flight-details">
                            <div class="flight-airports">
                                <span class="origin-label">${isArriving ? 'From' : 'To'}</span>
                                <div class="airport-content">
                                    ${isArriving ? `
                                        <div class="airport-flag">${originFlag}</div>
                                        <div class="airport-info">
                                            <div class="airport-city">${originCity}${originCountry ? `, ${originCountry}` : ''}</div>
                                            <div class="airport-code">${originCode}</div>
                                        </div>
                                    ` : `
                                        <div class="airport-flag">${destFlag}</div>
                                        <div class="airport-info">
                                            <div class="airport-city">${destCity}${destCountry ? `, ${destCountry}` : ''}</div>
                                            <div class="airport-code">${destCode}</div>
                                        </div>
                                    `}
                                </div>
                            </div>

                            <div class="flight-times">
                                ${(scheduledDep || actualDep || scheduledArr || estimatedArr) ? `
                                    <div class="merged-time-block">
                                        ${(scheduledDep || actualDep) ? `
                                            <div class="time-block">
                                                <div class="time-label">🛫 Departure</div>
                                                <div class="time-value-container">
                                                    ${scheduledDep && actualDep && scheduledDep !== actualDep ? `<div class="time-value crossed-out">${formatTime(scheduledDep)}</div>` : ''}
                                                    ${actualDep ? `
                                                        <div class="time-value">${formatTime(actualDep)}</div>
                                                    ` : scheduledDep ? `
                                                        <div class="time-value">${formatTime(scheduledDep)}</div>
                                                    ` : ''}
                                                </div>
                                            </div>
                                        ` : ''}
                                        ${(scheduledArr || estimatedArr) ? `
                                            <div class="time-block">
                                                <div class="time-label">🛬 Arrival</div>
                                                <div class="time-value-container">
                                                    ${scheduledArr && estimatedArr && scheduledArr !== estimatedArr ? `<div class="time-value crossed-out">${formatTime(scheduledArr)}</div>` : ''}
                                                    ${estimatedArr ? `
                                                        <div class="time-value">${formatTime(estimatedArr)}</div>
                                                    ` : scheduledArr ? `
                                                        <div class="time-value">${formatTime(scheduledArr)}</div>
                                                    ` : ''}
                                                </div>
                                            </div>
                                        ` : ''}
                                    </div>
                                ` : ''}
                            </div>

                            <div class="flight-times">
                                <div class="merged-time-block">
                                    <div class="time-block">
                                        <div class="time-label">⬆️ Altitude</div>
                                        <div class="time-value">${altitude}</div>
                                    </div>
                                    <div class="time-block">
                                        <div class="time-label">🚀 Speed</div>
                                        <div class="time-value">${speed}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = flightsHtml;

            // Update map stats
            document.getElementById('visible-count').textContent = enrichedFlights.length;
            document.getElementById('upcoming-count').textContent = dusUpcomingFlights.length;
            if (dusUpcomingFlights.length > 0 && dusUpcomingFlights[0].eta !== undefined) {
                document.getElementById('next-arrival').textContent = dusUpcomingFlights[0].eta;
            } else {
                document.getElementById('next-arrival').textContent = '--';
            }

            // Load photos asynchronously only for flights without cached photos
            enrichedFlights.forEach(async (flight) => {
                if (flight.registration) {
                    const rowId = `flight-${flight.flight_number?.replace(/\s/g, '-') || flight.id}`;
                    const photoElement = document.getElementById(`${rowId}-photo`);

                    // Check if we already have the photo URL cached
                    if (flight.photoUrl) {
                        // Use cached photo
                        if (photoElement) {
                            photoElement.innerHTML = `<img src="${flight.photoUrl}" alt="${flight.registration}" style="width: 100%; height: 100%; object-fit: contain; border-radius: 8px;" onerror="this.parentElement.innerHTML='✈️'">`;
                        }
                    } else {
                        // Fetch new photo
                        const photoUrl = await fetchAircraftPhoto(flight.registration);
                        if (photoUrl && photoElement) {
                            photoElement.innerHTML = `<img src="${photoUrl}" alt="${flight.registration}" style="width: 100%; height: 100%; object-fit: contain; border-radius: 8px;" onerror="this.parentElement.innerHTML='✈️'">`;

                            // Update cache with photo URL
                            if (enrichedFlightCache.has(flight.id)) {
                                const cached = enrichedFlightCache.get(flight.id);
                                cached.photoUrl = photoUrl;
                                enrichedFlightCache.set(flight.id, cached);
                            }
                        }
                    }
                }
            });
        }

        // Fetch ATIS data to determine runway configuration
        async function fetchATIS() {
            try {
                const now = Date.now();
                if (now - lastATISFetch < ATIS_REFRESH_INTERVAL && lastATISFetch > 0) {
                    return activeRunways;
                }

                const response = await fetchWithProxy(API_URLS.atis);
                
                if (!response.ok) {
                    console.warn('ATIS fetch failed, using cached runway config');
                    return activeRunways;
                }
                
                const html = await response.text();
                const runwayInfo = {
                    arrivals: [],
                    departures: []
                };
                
                // Extract arrival ATIS section
                const arrivalMatch = html.match(/Arrival ATIS[\s\S]*?<div class="atis">([\s\S]*?)<\/div>/i);
                if (arrivalMatch) {
                    const arrivalAtis = arrivalMatch[1];
                    const rwyMatch = arrivalAtis.match(/RWY\s*(05[LRC]?|23[LRC]?)/i);
                    if (rwyMatch) {
                        runwayInfo.arrivals.push(rwyMatch[1].toUpperCase());
                    }
                }

                // Extract departure ATIS section
                const departureMatch = html.match(/Departure ATIS[\s\S]*?<div class="atis">([\s\S]*?)<\/div>/i);
                if (departureMatch) {
                    const departureAtis = departureMatch[1];
                    const rwyMatch = departureAtis.match(/RWY\s*(05[LRC]?|23[LRC]?)/i);
                    if (rwyMatch) {
                        runwayInfo.departures.push(rwyMatch[1].toUpperCase());
                    }
                }

                activeRunways = runwayInfo;
                lastATISFetch = Date.now();
                return runwayInfo;
            } catch (error) {
                console.error('Error fetching ATIS:', error);
                return activeRunways;
            }
        }

        // Fetch upcoming flights from FlightRadarAPI backend or direct
        async function fetchDUSUpcomingFlights() {
            try {
                await fetchATIS();
                let upcoming = [];

                // Check runway configuration
                const hasArrivalRunway = activeRunways.arrivals.length > 0;
                const hasDepartureRunway = activeRunways.departures.length > 0;

                // If no ATIS data, fetch both
                const fetchBoth = !hasArrivalRunway && !hasDepartureRunway;

                // Determine what to fetch based on runway configuration
                // Prioritize arrivals over departures (same as visible planes)
                let fetchArrivals = false;
                let fetchDepartures = false;

                if (fetchBoth) {
                    // No ATIS data - fetch both
                    fetchArrivals = true;
                    fetchDepartures = true;
                } else if (hasArrivalRunway) {
                    // Only fetch arrivals when arrival runway is active
                    fetchArrivals = true;
                    fetchDepartures = false;
                } else if (hasDepartureRunway) {
                    // Only fetch departures when only departure runway is active
                    fetchArrivals = false;
                    fetchDepartures = true;
                }

                let airportData = null;

                // Try backend first if enabled
                if (USE_LOCAL_API) {
                    try {
                        const response = await fetch(API_URLS.localAirport('DUS'));
                        if (response.ok) {
                            const data = await response.json();
                            airportData = data.airport;
                        }
                    } catch (err) {
                        console.warn('Backend unavailable for airport data, using direct FR24 API');
                    }
                }

                // Fallback to direct FR24 API
                if (!airportData) {
                    const response = await fetchWithProxy(API_URLS.fr24Airport('DUS'));
                    if (response.ok) {
                        const data = await response.json();
                        airportData = data.result?.response?.airport?.pluginData?.schedule;
                    }
                }

                if (!airportData) {
                    console.warn('No airport data available');
                    dusUpcomingFlights = [];
                    return [];
                }

                // Process arrivals only if flag is set
                if (fetchArrivals && airportData.arrivals) {
                    const arrivals = Array.isArray(airportData.arrivals) ? airportData.arrivals : (airportData.arrivals.data || []);
                    arrivals.forEach(flight => {
                        let time = null;
                        let flightNumber = '';
                        let originIata = '';
                        let actualArrivalTime = null;

                        // Handle data from backend (FlightRadarAPI library format)
                        if (flight.time && flight.time.scheduled) {
                            // Use estimated time if available, otherwise use scheduled
                            const estimatedTime = flight.time.estimated?.arrival || flight.time.real?.arrival;
                            time = new Date((estimatedTime || flight.time.scheduled.arrival) * 1000);
                            flightNumber = flight.identification?.number?.default || flight.identification?.callsign || '';
                            originIata = flight.airport?.origin?.code?.iata || '';
                            actualArrivalTime = flight.time.real?.arrival ? new Date(flight.time.real.arrival * 1000) : null;
                        }
                        // Handle data from direct FR24 API
                        else if (flight.flight && flight.flight.time) {
                            // Use estimated time if available, otherwise use scheduled
                            const estimatedTime = flight.flight.time.estimated?.arrival || flight.flight.time.real?.arrival;
                            const schedTime = estimatedTime || flight.flight.time.scheduled?.arrival;
                            if (schedTime) {
                                time = new Date(schedTime * 1000);
                                flightNumber = flight.flight.identification?.number?.default || flight.flight.identification?.callsign || '';
                                originIata = flight.flight.airport?.origin?.code?.iata || '';
                                actualArrivalTime = flight.flight.time.real?.arrival ? new Date(flight.flight.time.real.arrival * 1000) : null;
                            }
                        }

                        if (time) {
                            const now = new Date();

                            // Skip if flight has already landed
                            if (actualArrivalTime && actualArrivalTime < now) {
                                return;
                            }

                            const minutesAway = Math.round((time - now) / 60000);

                            if (minutesAway > -10 && minutesAway < 120) {
                                upcoming.push({
                                    flight_number: flightNumber,
                                    origin_iata: originIata,
                                    destination_iata: 'DUS',
                                    eta: minutesAway > 0 ? minutesAway : 0,
                                    time: time,
                                    isArrival: true
                                });
                            }
                        }
                    });
                }

                // Process departures only if flag is set
                if (fetchDepartures && airportData.departures) {
                    const departures = Array.isArray(airportData.departures) ? airportData.departures : (airportData.departures.data || []);
                    departures.forEach(flight => {
                        let time = null;
                        let flightNumber = '';
                        let destIata = '';
                        let actualDepartureTime = null;

                        // Handle data from backend (FlightRadarAPI library format)
                        if (flight.time && flight.time.scheduled) {
                            // Use estimated time if available, otherwise use scheduled
                            const estimatedTime = flight.time.estimated?.departure || flight.time.real?.departure;
                            time = new Date((estimatedTime || flight.time.scheduled.departure) * 1000);
                            flightNumber = flight.identification?.number?.default || flight.identification?.callsign || '';
                            destIata = flight.airport?.destination?.code?.iata || '';
                            actualDepartureTime = flight.time.real?.departure ? new Date(flight.time.real.departure * 1000) : null;
                        }
                        // Handle data from direct FR24 API
                        else if (flight.flight && flight.flight.time) {
                            // Use estimated time if available, otherwise use scheduled
                            const estimatedTime = flight.flight.time.estimated?.departure || flight.flight.time.real?.departure;
                            const schedTime = estimatedTime || flight.flight.time.scheduled?.departure;
                            if (schedTime) {
                                time = new Date(schedTime * 1000);
                                flightNumber = flight.flight.identification?.number?.default || flight.flight.identification?.callsign || '';
                                destIata = flight.flight.airport?.destination?.code?.iata || '';
                                actualDepartureTime = flight.flight.time.real?.departure ? new Date(flight.flight.time.real.departure * 1000) : null;
                            }
                        }

                        if (time) {
                            const now = new Date();

                            // Skip if flight has already departed
                            if (actualDepartureTime && actualDepartureTime < now) {
                                return;
                            }

                            const minutesAway = Math.round((time - now) / 60000);

                            if (minutesAway > -10 && minutesAway < 120) {
                                upcoming.push({
                                    flight_number: flightNumber,
                                    origin_iata: 'DUS',
                                    destination_iata: destIata,
                                    eta: minutesAway > 0 ? minutesAway : 0,
                                    time: time,
                                    isArrival: false
                                });
                            }
                        }
                    });
                }

                // Sort by time (soonest first)
                upcoming.sort((a, b) => a.time - b.time);

                // If no flights found for today, get first 3 flights for tomorrow
                if (upcoming.length === 0) {
                    console.log('No flights found for today, fetching tomorrow\'s flights...');
                    const tomorrowFlights = [];
                    const now = new Date();
                    const endOfToday = new Date(now);
                    endOfToday.setHours(23, 59, 59, 999);
                    const endOfTomorrow = new Date(endOfToday);
                    endOfTomorrow.setDate(endOfTomorrow.getDate() + 1);

                    // Process arrivals for tomorrow
                    if (fetchArrivals && airportData.arrivals) {
                        const arrivals = Array.isArray(airportData.arrivals) ? airportData.arrivals : (airportData.arrivals.data || []);
                        arrivals.forEach(flight => {
                            let time = null;
                            let flightNumber = '';
                            let originIata = '';

                            if (flight.time && flight.time.scheduled) {
                                const estimatedTime = flight.time.estimated?.arrival || flight.time.real?.arrival;
                                time = new Date((estimatedTime || flight.time.scheduled.arrival) * 1000);
                                flightNumber = flight.identification?.number?.default || flight.identification?.callsign || '';
                                originIata = flight.airport?.origin?.code?.iata || '';
                            } else if (flight.flight && flight.flight.time) {
                                const estimatedTime = flight.flight.time.estimated?.arrival || flight.flight.time.real?.arrival;
                                const schedTime = estimatedTime || flight.flight.time.scheduled?.arrival;
                                if (schedTime) {
                                    time = new Date(schedTime * 1000);
                                    flightNumber = flight.flight.identification?.number?.default || flight.flight.identification?.callsign || '';
                                    originIata = flight.flight.airport?.origin?.code?.iata || '';
                                }
                            }

                            if (time && time > endOfToday && time <= endOfTomorrow) {
                                tomorrowFlights.push({
                                    flight_number: flightNumber,
                                    origin_iata: originIata,
                                    destination_iata: 'DUS',
                                    time: time,
                                    isArrival: true,
                                    isTomorrow: true
                                });
                            }
                        });
                    }

                    // Process departures for tomorrow
                    if (fetchDepartures && airportData.departures) {
                        const departures = Array.isArray(airportData.departures) ? airportData.departures : (airportData.departures.data || []);
                        departures.forEach(flight => {
                            let time = null;
                            let flightNumber = '';
                            let destIata = '';

                            if (flight.time && flight.time.scheduled) {
                                const estimatedTime = flight.time.estimated?.departure || flight.time.real?.departure;
                                time = new Date((estimatedTime || flight.time.scheduled.departure) * 1000);
                                flightNumber = flight.identification?.number?.default || flight.identification?.callsign || '';
                                destIata = flight.airport?.destination?.code?.iata || '';
                            } else if (flight.flight && flight.flight.time) {
                                const estimatedTime = flight.flight.time.estimated?.departure || flight.flight.time.real?.departure;
                                const schedTime = estimatedTime || flight.flight.time.scheduled?.departure;
                                if (schedTime) {
                                    time = new Date(schedTime * 1000);
                                    flightNumber = flight.flight.identification?.number?.default || flight.flight.identification?.callsign || '';
                                    destIata = flight.flight.airport?.destination?.code?.iata || '';
                                }
                            }

                            if (time && time > endOfToday && time <= endOfTomorrow) {
                                tomorrowFlights.push({
                                    flight_number: flightNumber,
                                    origin_iata: 'DUS',
                                    destination_iata: destIata,
                                    time: time,
                                    isArrival: false,
                                    isTomorrow: true
                                });
                            }
                        });
                    }

                    // Sort and take first 3
                    tomorrowFlights.sort((a, b) => a.time - b.time);
                    upcoming = tomorrowFlights.slice(0, 3);
                    console.log(`Found ${upcoming.length} flights for tomorrow:`, upcoming.map(f => `${f.flight_number} at ${new Date(f.time).toLocaleTimeString()}`));
                }

                console.log(`Total upcoming flights to display: ${upcoming.length}`);
                dusUpcomingFlights = upcoming;
                return upcoming;
            } catch (error) {
                console.error('Error fetching upcoming flights:', error.message);
                dusUpcomingFlights = [];
                return [];
            }
        }

        // Center map on a specific flight
        async function centerMapOnFlight(flightNumber, originIata, destIata) {
            // Find the flight in upcomingFlightData (which has coordinates)
            let flight = upcomingFlightData.find(f => {
                const fNum = f.flight_number || f.callsign || '';
                return fNum.trim() === flightNumber.trim() &&
                       f.origin_iata === originIata &&
                       f.destination_iata === destIata;
            });

            // If not found in upcoming, check visible flights
            if (!flight) {
                flight = fr24FlightData.find(f => {
                    const fNum = f.flight_number || f.callsign || '';
                    return fNum.trim() === flightNumber.trim() &&
                           f.origin_iata === originIata &&
                           f.destination_iata === destIata;
                });
            }

            // If still not found, try searching in a wider area
            if (!flight || !flight.latitude || !flight.longitude) {
                // Search in a much wider area around DUS
                const wideBounds = `52.0,50.6,5.5,8.0`; // Covers most of western Germany
                const apiUrl = API_URLS.fr24Feed(wideBounds);

                try {
                    const response = await fetchWithProxy(apiUrl);
                    if (response.ok) {
                        const data = await response.json();

                        // Parse FR24 data to find our flight
                        for (const [key, value] of Object.entries(data)) {
                            if (!Array.isArray(value) || value.length < 18) continue;

                            const flightNum = value[13]; // flight_number
                            const origin = value[11]; // origin_iata
                            const dest = value[12]; // destination_iata

                            if (flightNum?.trim() === flightNumber.trim() &&
                                origin === originIata &&
                                dest === destIata) {
                                flight = {
                                    latitude: value[1],
                                    longitude: value[2]
                                };
                                break;
                            }
                        }
                    }
                } catch (error) {
                    console.error('Error searching for flight:', error);
                }
            }

            if (flight && flight.latitude && flight.longitude) {
                const mapIframe = document.getElementById('map-iframe');
                if (mapIframe) {
                    const newSrc = `https://www.flightradar24.com/simple_index.php?lat=${flight.latitude}&lon=${flight.longitude}&z=11`;
                    mapIframe.src = newSrc;
                }
            } else {
                console.warn(`Flight ${flightNumber} is not being tracked yet (may still be on ground or outside tracking area)`);
            }
        }

        // Reset map to default position
        function resetMap() {
            const mapIframe = document.getElementById('map-iframe');
            if (mapIframe) {
                mapIframe.src = 'https://www.flightradar24.com/simple_index.php?lat=51.305&lon=6.825&z=13';
            }
        }

        // Display upcoming flights from DUS Airport API
        function displayUpcomingFlights() {
            const container = document.getElementById('upcoming-container');
            const titleElement = document.getElementById('upcoming-title');

            if (!dusUpcomingFlights?.length) {
                if (titleElement) titleElement.textContent = 'Upcoming';
                container.innerHTML = `
                    <div style="text-align: center; padding: 20px; color: var(--white-semi); font-size: 0.9em;">
                        Scanning for flights...
                    </div>
                `;
                return;
            }

            // Filter out flights that are already visible in the detailed view
            const filteredUpcoming = dusUpcomingFlights.filter(dusFlight => {
                return !fr24FlightData.some(visibleFlight => {
                    const visibleFlightNumber = visibleFlight.flight_number || visibleFlight.callsign || '';
                    const dusFlightNumber = dusFlight.flight_number || '';
                    return visibleFlightNumber.trim() === dusFlightNumber.trim() &&
                           visibleFlight.origin_iata === dusFlight.origin_iata &&
                           visibleFlight.destination_iata === dusFlight.destination_iata;
                });
            });

            if (!filteredUpcoming.length) {
                if (titleElement) titleElement.textContent = 'Upcoming';
                container.innerHTML = `
                    <div style="text-align: center; padding: 20px; color: var(--white-semi); font-size: 0.9em;">
                        No upcoming flights
                    </div>
                `;
                return;
            }

            // Update title based on whether showing tomorrow's flights
            const showingTomorrow = filteredUpcoming.some(f => f.isTomorrow);
            if (titleElement) {
                titleElement.textContent = showingTomorrow ? 'Tomorrow' : 'Upcoming';
            }

            // Show ALL upcoming flights
            const upcomingHtml = filteredUpcoming.map((flight, index) => {
                const flightNumber = flight.flight_number || 'Unknown';
                const route = `${flight.origin_iata || '?'} ✈ ${flight.destination_iata || '?'}`;

                const upcomingClass = flight.isArrival ? 'arrival' : 'departure';
                const upcomingIcon = flight.isArrival ? '🛬' : '🛫';

                // Format display based on whether it's today or tomorrow
                let timeDisplay = '';
                if (flight.isTomorrow) {
                    // Show formatted time for tomorrow's flights
                    const flightTime = new Date(flight.time);
                    const hours = String(flightTime.getHours()).padStart(2, '0');
                    const minutes = String(flightTime.getMinutes()).padStart(2, '0');
                    timeDisplay = `
                        <div class="upcoming-eta" style="font-size: 1.1em;">${hours}:${minutes}</div>
                        <div style="font-size: 0.65em; color: var(--white-semi); margin-top: 2px;">Tomorrow</div>
                    `;
                } else {
                    // Show ETA in minutes for today's flights
                    const eta = flight.eta !== undefined ? flight.eta : '?';
                    timeDisplay = `<div class="upcoming-eta">~${eta} min</div>`;
                }

                return `
                    <div class="upcoming-row ${upcomingClass}" style="cursor: pointer;" onclick="centerMapOnFlight('${flightNumber}', '${flight.origin_iata || ''}', '${flight.destination_iata || ''}')">
                        <div class="upcoming-info">
                            <div class="upcoming-flight-number">${upcomingIcon} ${flightNumber}</div>
                            <div class="upcoming-route">${route}</div>
                        </div>
                        <div style="text-align: right;">
                            ${timeDisplay}
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = upcomingHtml;
        }

        // Display active runway
        function displayRunway() {
            const container = document.getElementById('runway-display');

            if (!activeRunways || (!activeRunways.arrivals.length && !activeRunways.departures.length)) {
                container.innerHTML = `
                    <div style="color: var(--white-semi); font-size: 0.9em;">
                        Loading runway info...
                    </div>
                `;
                return;
            }

            // Determine primary runway - prefer arrivals for runway 23, departures for runway 05
            let runway = '';

            if (activeRunways.arrivals.some(rwy => rwy.startsWith('23'))) {
                // Get the full runway designation (e.g., 23L, 23R)
                const arrivalRunways = activeRunways.arrivals.filter(rwy => rwy.startsWith('23'));
                runway = arrivalRunways[0]; // Use full designation
            } else if (activeRunways.departures.some(rwy => rwy.startsWith('05'))) {
                // Get the full runway designation (e.g., 05L, 05R)
                const departureRunways = activeRunways.departures.filter(rwy => rwy.startsWith('05'));
                runway = departureRunways[0]; // Use full designation
            } else if (activeRunways.arrivals.length > 0) {
                runway = activeRunways.arrivals[0]; // Full designation
            } else if (activeRunways.departures.length > 0) {
                runway = activeRunways.departures[0]; // Full designation
            }

            if (!runway) {
                container.innerHTML = `
                    <div style="color: var(--white-semi); font-size: 0.9em;">
                        No runway data
                    </div>
                `;
                return;
            }

            // Get base runway number for image (just the number part)
            const baseRunway = runway.substring(0, 2);
            const runwayImageUrl = `https://metar-taf.com/images/rwy/3d-${baseRunway}.svg`;

            container.innerHTML = `
                <div style="text-align: center;">
                    <div style="font-size: 1.1em; font-weight: 600; color: var(--white); margin-bottom: 10px;">
                        Active Runway ${runway}
                    </div>
                    <img src="${runwayImageUrl}" alt="Runway ${runway}" style="width: 100%; max-width: 250px; height: auto;" onerror="this.parentElement.innerHTML='<div style=\'color: var(--white-semi); padding: 20px;\'>Runway ${runway} in use</div>'">
                </div>
            `;
        }

        // Update timestamp display
        function updateTimestamp() {
            const updateElement = document.getElementById('global-last-update');
            if (updateElement) {
                if (lastDataUpdateTime > 0) {
                    // Format date and time (hh:mm:ss)
                    const updateDate = new Date(lastDataUpdateTime);
                    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    const month = months[updateDate.getMonth()];
                    const day = updateDate.getDate();
                    const year = updateDate.getFullYear();
                    const hours = String(updateDate.getHours()).padStart(2, '0');
                    const minutes = String(updateDate.getMinutes()).padStart(2, '0');
                    const seconds = String(updateDate.getSeconds()).padStart(2, '0');
                    updateElement.textContent = `Last updated: ${month} ${day}, ${year} at ${hours}:${minutes}:${seconds}`;
                } else {
                    const nowDate = new Date();
                    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    const month = months[nowDate.getMonth()];
                    const day = nowDate.getDate();
                    const year = nowDate.getFullYear();
                    const hours = String(nowDate.getHours()).padStart(2, '0');
                    const minutes = String(nowDate.getMinutes()).padStart(2, '0');
                    const seconds = String(nowDate.getSeconds()).padStart(2, '0');
                    updateElement.textContent = `Waiting for update... ${month} ${day}, ${year} at ${hours}:${minutes}:${seconds}`;
                }
            }
        }

        // Determine optimal refresh interval based on activity
        function getOptimalRefreshInterval() {
            const visibleCount = fr24FlightData.length;
            const upcomingCount = upcomingFlightData.length;

            // Check if any planes are very close (ETA < 5 minutes)
            const hasCloseFlights = upcomingFlightData.some(f => f.eta < 5);

            // Check if any scheduled flights are very close
            const hasCloseScheduled = dusUpcomingFlights.some(f => f.eta < 10);

            if (visibleCount > 0 || hasCloseFlights) {
                // Fast refresh when planes are visible or very close
                return REFRESH_INTERVAL_FAST;
            } else if (upcomingCount > 0 || hasCloseScheduled) {
                // Normal refresh when planes are approaching
                return REFRESH_INTERVAL_NORMAL;
            } else {
                // Slow refresh when no activity
                return REFRESH_INTERVAL_SLOW;
            }
        }

        // Update and display flights
        async function updateAndDisplayFlights() {
            const now = Date.now();
            const shouldFetch = (now - lastFR24Fetch > currentRefreshInterval || lastFR24Fetch === 0);

            if (shouldFetch) {
                await fetchATIS(); // Fetch runway configuration first
                await fetchFlightRadar24Data();
                await fetchDUSUpcomingFlights(); // Fetch scheduled flights from airport API
                updateTimestamp();

                // Adjust refresh interval based on current activity
                const newInterval = getOptimalRefreshInterval();
                if (newInterval !== currentRefreshInterval) {
                    currentRefreshInterval = newInterval;
                }
            }

            await displayFlights();
            displayUpcomingFlights();
            displayRunway();
        }

        // Initial load
        updateAndDisplayFlights();

        // Smart refresh system - checks frequently but only fetches when needed
        setInterval(() => {
            updateAndDisplayFlights();
        }, 5000); // Check every 5 seconds, but actual fetch depends on activity
    </script>
