<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITQ Plane Spotter - Düsseldorf Airport</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: #f5f7fa;
            color: #2c3e50;
            padding: 0;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 30px;
            background: linear-gradient(135deg, #0066cc 0%, #004c99 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.15);
            position: relative;
        }

        header::after {
            content: 'v1.1';
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 0.7em;
            opacity: 0.6;
        }

        h1 {
            font-size: 2.2em;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .location-info {
            font-size: 1em;
            opacity: 0.95;
            margin-top: 8px;
            font-weight: 400;
        }

        .status {
            text-align: center;
            padding: 15px;
            margin-bottom: 20px;
            background: white;
            border-radius: 8px;
            font-size: 1em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            color: #2c3e50;
        }

        .loading {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .flights-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 30px;
        }

        .flight-row {
            background: white;
            color: #2c3e50;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.2s ease;
            animation: slideIn 0.3s ease;
            display: grid;
            grid-template-columns: 100px 1fr auto;
            gap: 24px;
            align-items: center;
            border: 1px solid #e8edf2;
        }

        .flight-row:hover {
            box-shadow: 0 4px 16px rgba(0, 102, 204, 0.12);
            transform: translateY(-2px);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .flight-row.arriving {
            border-left: 5px solid #10b981;
        }

        .flight-row.departing {
            border-left: 5px solid #ff6b35;
        }

        .flight-photo {
            width: 100px;
            height: 75px;
            object-fit: cover;
            border-radius: 8px;
            background: #f0f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            border: 1px solid #e8edf2;
        }

        .flight-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .flight-number {
            font-size: 1.5em;
            font-weight: 700;
            color: #0066cc;
            letter-spacing: -0.3px;
        }

        .flight-airline {
            font-size: 0.95em;
            color: #6b7280;
            font-weight: 500;
        }

        .flight-route {
            font-size: 1.05em;
            color: #2c3e50;
            font-weight: 500;
            margin-top: 2px;
        }

        .status-badge {
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 0.8em;
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .status-badge.arriving {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
        }

        .status-badge.departing {
            background: linear-gradient(135deg, #ff6b35 0%, #f04e23 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(255, 107, 53, 0.3);
        }

        .footer {
            text-align: center;
            padding: 24px;
            background: white;
            border-radius: 12px;
            margin-top: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e8edf2;
        }

        .last-update {
            font-size: 0.9em;
            color: #6b7280;
            font-weight: 500;
        }

        .no-flights {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            font-size: 1.2em;
            color: #6b7280;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e8edf2;
        }

        .plane-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            header {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.6em;
            }

            .flight-row {
                grid-template-columns: 70px 1fr;
                gap: 16px;
                padding: 16px;
            }

            .flight-photo {
                width: 70px;
                height: 52px;
            }

            .flight-number {
                font-size: 1.2em;
            }

            .flight-route {
                font-size: 0.95em;
            }

            .status-badge {
                grid-column: 1 / -1;
                justify-self: start;
                margin-top: 8px;
                padding: 8px 16px;
                font-size: 0.75em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✈️ ITQ Plane Spotter</h1>
        </header>

        <div class="flights-container" id="flights-container">
        </div>

        <div class="footer">
            <div class="last-update" id="last-update">Waiting for data...</div>
            <div style="margin-top: 10px; opacity: 0.7; font-size: 0.9em;">
                Live flight data from Düsseldorf Airport (updates every minute)
            </div>
        </div>
    </div>

    <script>
        // App version for cache busting
        console.log('%c ITQ Plane Spotter v1.1 ', 'background: #0066cc; color: white; padding: 4px 8px; border-radius: 3px; font-weight: bold');
        console.log('✈️ FR24 Feed + Professional Design');
        console.log('⚠️ If you see CORS errors, press Ctrl+Shift+R (Windows) or Cmd+Shift+R (Mac) to hard refresh');

        // Get country flag emoji
        function getCountryFlag(countryName) {
            const countryFlags = {
                'Germany': '🇩🇪', 'France': '🇫🇷', 'Spain': '🇪🇸', 'Italy': '🇮🇹',
                'United Kingdom': '🇬🇧', 'Netherlands': '🇳🇱', 'Belgium': '🇧🇪',
                'Switzerland': '🇨🇭', 'Austria': '🇦🇹', 'Portugal': '🇵🇹',
                'Greece': '🇬🇷', 'Poland': '🇵🇱', 'Turkey': '🇹🇷', 'Türkiye': '🇹🇷',
                'United States': '🇺🇸', 'Canada': '🇨🇦',
                'United Arab Emirates': '🇦🇪', 'Qatar': '🇶🇦', 'Saudi Arabia': '🇸🇦',
                'Egypt': '🇪🇬', 'Morocco': '🇲🇦', 'Tunisia': '🇹🇳', 'Algeria': '🇩🇿',
                'Israel': '🇮🇱', 'Lebanon': '🇱🇧', 'Jordan': '🇯🇴',
                'India': '🇮🇳', 'China': '🇨🇳', 'Japan': '🇯🇵', 'South Korea': '🇰🇷',
                'Singapore': '🇸🇬', 'Thailand': '🇹🇭', 'Malaysia': '🇲🇾', 'Indonesia': '🇮🇩',
                'Russia': '🇷🇺', 'Ukraine': '🇺🇦', 'Sweden': '🇸🇪', 'Norway': '🇳🇴',
                'Denmark': '🇩🇰', 'Finland': '🇫🇮', 'Ireland': '🇮🇪',
                'Czech Republic': '🇨🇿', 'Hungary': '🇭🇺', 'Romania': '🇷🇴',
                'Bulgaria': '🇧🇬', 'Croatia': '🇭🇷', 'Serbia': '🇷🇸',
                'Slovenia': '🇸🇮', 'Slovakia': '🇸🇰', 'Lithuania': '🇱🇹',
                'Latvia': '🇱🇻', 'Estonia': '🇪🇪', 'Iceland': '🇮🇸',
                'Luxembourg': '🇱🇺', 'Malta': '🇲🇹', 'Cyprus': '🇨🇾',
                'Brazil': '🇧🇷', 'Argentina': '🇦🇷', 'Mexico': '🇲🇽',
                'Chile': '🇨🇱', 'Colombia': '🇨🇴', 'Peru': '🇵🇪',
                'Australia': '🇦🇺', 'New Zealand': '🇳🇿',
                'South Africa': '🇿🇦', 'Kenya': '🇰🇪', 'Ethiopia': '🇪🇹', 'Nigeria': '🇳🇬'
            };
            return countryFlags[countryName] || '🌍';
        }

        // Extract country name from "City, Country" format
        function extractCountryFromLocation(location) {
            if (!location) return '';
            const parts = location.split(',');
            if (parts.length >= 2) {
                return parts[parts.length - 1].trim();
            }
            return '';
        }

        // Cache for FR24 flight data
        let fr24FlightData = [];
        let lastFR24Fetch = 0;

        // Fetch live flights from FlightRadar24 feed.js API
        async function fetchFlightRadar24Data() {
            try {
                // User's exact viewing area (northeast office view)
                // Southwest: 51.289748, 6.782513
                // Northeast: 51.338119, 6.877785
                const north = 51.338119;
                const south = 51.289748;
                const west = 6.782513;
                const east = 6.877785;

                // FR24 feed.js API - bounds format: north,south,west,east
                const bounds = `${north},${south},${west},${east}`;
                const apiUrl = `https://data-cloud.flightradar24.com/zones/fcgi/feed.js?bounds=${bounds}&faa=1&satellite=1&mlat=1&flarm=1&adsb=1&gnd=1&air=1&vehicles=0&estimated=1&maxage=14400&gliders=0&stats=0`;

                // Use CORS proxy to avoid CORS blocking
                const proxyUrl = 'https://corsproxy.io/?';
                const url = proxyUrl + encodeURIComponent(apiUrl);

                console.log(`Fetching FR24 feed data for viewing area: ${bounds}`);
                console.log(`Using CORS proxy: ${proxyUrl}`);
                const response = await fetch(url);

                if (response.ok) {
                    const data = await response.json();
                    const flights = [];

                    // Parse FR24 data (each key is a flight, value is array)
                    for (const [key, value] of Object.entries(data)) {
                        // Skip metadata entries (only process numeric keys or flight IDs)
                        if (!Array.isArray(value) || value.length < 18) continue;

                        // Parse array according to FR24 format
                        const flightData = {
                            id: key,                      // Flight ID for details lookup
                            icao24: value[0],            // [0] ICAO 24-bit address
                            latitude: value[1],           // [1]
                            longitude: value[2],          // [2]
                            heading: value[3],            // [3]
                            altitude: value[4],           // [4]
                            ground_speed: value[5],       // [5]
                            squawk: value[6],             // [6]
                            aircraft_code: value[8],      // [8]
                            registration: value[9],       // [9] *** Aircraft registration ***
                            timestamp: value[10],         // [10]
                            origin_iata: value[11],       // [11] Origin airport IATA
                            destination_iata: value[12],  // [12] Destination airport IATA
                            flight_number: value[13],     // [13] Flight number
                            on_ground: value[14],         // [14]
                            vertical_speed: value[15],    // [15]
                            callsign: value[16],          // [16] Callsign
                            airline_icao: value[18]       // [18] Airline ICAO
                        };

                        flights.push(flightData);
                    }

                    console.log(`FR24: Found ${flights.length} flights in viewing area`);
                    fr24FlightData = flights;
                    lastFR24Fetch = Date.now();
                    return flights;
                }

                console.log('FR24: Failed to fetch feed data');
                return [];
            } catch (error) {
                console.error('Error fetching FR24 feed:', error);
                return [];
            }
        }

        // Fetch detailed flight information from FR24 clickhandler API
        async function fetchFlightDetails(flightId) {
            try {
                const apiUrl = `https://data-live.flightradar24.com/clickhandler/?flight=${flightId}`;
                const proxyUrl = 'https://corsproxy.io/?';
                const url = proxyUrl + encodeURIComponent(apiUrl);

                const response = await fetch(url);
                if (response.ok) {
                    const data = await response.json();
                    return data;
                }
                return null;
            } catch (error) {
                console.error(`Error fetching details for flight ${flightId}:`, error);
                return null;
            }
        }

        // Fetch aircraft photo from Planespotters API
        async function fetchAircraftPhoto(registration) {
            if (!registration) return null;
            try {
                // Use CORS proxy for Planespotters API
                const proxyUrl = 'https://corsproxy.io/?';
                const apiUrl = `https://api.planespotters.net/pub/photos/reg/${registration}`;
                const url = proxyUrl + encodeURIComponent(apiUrl);

                console.log(`Fetching photo for ${registration}`);
                const response = await fetch(url);
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.photos && data.photos.length > 0) {
                        const photoUrl = data.photos[0].thumbnail_large?.src || data.photos[0].thumbnail?.src;
                        console.log(`Found photo for ${registration}: ${photoUrl}`);
                        return photoUrl;
                    }
                }
                console.log(`No photo found for ${registration}`);
                return null;
            } catch (error) {
                console.error(`Error fetching aircraft photo for ${registration}:`, error);
                return null;
            }
        }










        // Update flight details cache and display
        // Display flights from FR24 data
        async function displayFlights() {
            const container = document.getElementById('flights-container');

            if (!fr24FlightData || fr24FlightData.length === 0) {
                container.innerHTML = `
                    <div class="no-flights">
                        <div class="plane-icon">🔍</div>
                        <div>No flights in viewing area</div>
                        <div style="font-size: 0.8em; margin-top: 15px; opacity: 0.7;">
                            Looking northeast from ITQ office...
                        </div>
                    </div>
                `;
                return;
            }

            console.log(`Processing ${fr24FlightData.length} flights for display`);

            // Fetch details for each flight and enrich data
            const enrichedFlights = await Promise.all(
                fr24FlightData.map(async (flight) => {
                    const details = await fetchFlightDetails(flight.id);

                    return {
                        ...flight,
                        details: details,
                        // Extract useful info from details
                        airline_name: details?.airline?.name || flight.airline_icao || '',
                        origin_name: details?.airport?.origin?.name || flight.origin_iata || '',
                        origin_city: details?.airport?.origin?.position?.region?.city || '',
                        origin_country: details?.airport?.origin?.position?.country?.name || '',
                        destination_name: details?.airport?.destination?.name || flight.destination_iata || '',
                        destination_city: details?.airport?.destination?.position?.region?.city || '',
                        destination_country: details?.airport?.destination?.position?.country?.name || '',
                        scheduled_time: details?.time?.scheduled?.departure || details?.time?.scheduled?.arrival || 0,
                        estimated_time: details?.time?.estimated?.departure || details?.time?.estimated?.arrival || 0,
                        status_text: details?.status?.text || ''
                    };
                })
            );

            // Sort by scheduled time
            enrichedFlights.sort((a, b) => a.scheduled_time - b.scheduled_time);

            console.log(`Displaying ${enrichedFlights.length} flights`);

            // Determine if arriving or departing based on destination
            const flightsHtml = enrichedFlights.map(flight => {
                const isArriving = flight.destination_iata === 'DUS' || flight.destination_name?.includes('Düsseldorf');
                const flightStatus = isArriving ? 'arriving' : 'departing';

                // Get location to display
                let location, locationLabel, countryFlag;
                if (isArriving) {
                    const country = flight.origin_country || '';
                    const city = flight.origin_city || flight.origin_name || flight.origin_iata;
                    location = country ? `${city}, ${country}` : city;
                    locationLabel = 'from';
                    countryFlag = getCountryFlag(country);
                } else {
                    const country = flight.destination_country || '';
                    const city = flight.destination_city || flight.destination_name || flight.destination_iata;
                    location = country ? `${city}, ${country}` : city;
                    locationLabel = 'to';
                    countryFlag = getCountryFlag(country);
                }

                // Format times
                let timeDisplay = '';
                if (flight.scheduled_time) {
                    const scheduled = new Date(flight.scheduled_time * 1000).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                    timeDisplay = `<div style="font-size: 0.85em; color: #64748b; margin-top: 2px;">Planned: ${scheduled}`;

                    if (flight.estimated_time && flight.estimated_time !== flight.scheduled_time) {
                        const estimated = new Date(flight.estimated_time * 1000).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                        timeDisplay += ` | Expected: ${estimated}`;
                    }
                    timeDisplay += '</div>';
                }

                const rowId = `flight-${flight.flight_number?.replace(/\s/g, '-') || flight.id}`;
                const photoId = `${rowId}-photo`;

                return `
                    <div class="flight-row ${flightStatus}" id="${rowId}">
                        <div class="flight-photo" id="${photoId}">✈️</div>
                        <div class="flight-info">
                            <div class="flight-number">${flight.flight_number || flight.callsign || 'Unknown'}</div>
                            ${flight.airline_name ? `<div class="flight-airline">${flight.airline_name}</div>` : ''}
                            <div class="flight-route">${countryFlag} ${locationLabel} ${location}</div>
                            ${timeDisplay}
                            <div style="font-size: 0.75em; color: #9ca3af; margin-top: 2px;">${flight.registration || 'No reg'}</div>
                        </div>
                        <div class="status-badge ${flightStatus}">${flightStatus}</div>
                    </div>
                `;
            }).join('');

            container.innerHTML = flightsHtml;

            // Load photos asynchronously
            enrichedFlights.forEach(async (flight) => {
                if (flight.registration) {
                    const photoUrl = await fetchAircraftPhoto(flight.registration);
                    if (photoUrl) {
                        const rowId = `flight-${flight.flight_number?.replace(/\s/g, '-') || flight.id}`;
                        const photoElement = document.getElementById(`${rowId}-photo`);
                        if (photoElement) {
                            photoElement.innerHTML = `<img src="${photoUrl}" alt="${flight.registration}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;" onerror="this.parentElement.innerHTML='✈️'">`;
                        }
                    }
                }
            });

            document.getElementById('last-update').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
        }

        // Update and display flights
        async function updateAndDisplayFlights() {
            const now = Date.now();
            // Fetch every 2 minutes
            if (now - lastFR24Fetch > 120000 || lastFR24Fetch === 0) {
                await fetchFlightRadar24Data();
                await displayFlights();
            }
        }

        // Initial load
        updateAndDisplayFlights();

        // Refresh every 2 minutes
        setInterval(updateAndDisplayFlights, 120000);
    </script>
</body>
</html>
