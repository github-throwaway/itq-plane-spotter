<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITQ Plane Spotter - Düsseldorf Airport</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .location-info {
            font-size: 1.1em;
            opacity: 0.9;
            margin-top: 10px;
        }

        .status {
            text-align: center;
            padding: 15px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 1.1em;
        }

        .loading {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .flights-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .flight-card {
            background: rgba(255, 255, 255, 0.95);
            color: #1e3c72;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideIn 0.5s ease;
        }

        .flight-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 48px rgba(0,0,0,0.3);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .flight-card.arriving {
            border-left: 5px solid #22c55e;
        }

        .flight-card.departing {
            border-left: 5px solid #f59e0b;
        }


        .flight-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(30, 60, 114, 0.1);
        }

        .callsign {
            font-size: 1.8em;
            font-weight: bold;
            color: #1e3c72;
        }

        .status-badge {
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-badge.arriving {
            background: #22c55e;
            color: white;
        }

        .status-badge.departing {
            background: #f59e0b;
            color: white;
        }

        .flight-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.85em;
            color: #64748b;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-size: 1.2em;
            font-weight: 600;
            color: #1e3c72;
        }

        .origin-dest {
            grid-column: span 2;
            margin-top: 10px;
            padding: 15px;
            background: rgba(30, 60, 114, 0.05);
            border-radius: 10px;
            text-align: center;
        }

        .origin-dest .detail-value {
            font-size: 1.4em;
            color: #1e3c72;
        }

        .distance-info {
            grid-column: span 2;
            text-align: center;
            padding: 10px;
            background: rgba(30, 60, 114, 0.08);
            border-radius: 8px;
            margin-top: 10px;
        }

        .distance-info .detail-value {
            font-size: 1.1em;
        }

        .footer {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 30px;
        }

        .last-update {
            font-size: 0.95em;
            opacity: 0.8;
        }

        .no-flights {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            font-size: 1.3em;
        }

        .plane-icon {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .map-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .map-title {
            text-align: center;
            font-size: 1.2em;
            margin-bottom: 15px;
            font-weight: 600;
        }

        #viewing-map {
            width: 100%;
            height: 400px;
            border-radius: 10px;
            background: #ffffff;
            display: block;
        }

        .route-info {
            grid-column: span 2;
            margin-top: 10px;
            padding: 15px;
            background: rgba(30, 60, 114, 0.05);
            border-radius: 10px;
        }

        .route-info .detail-value {
            font-size: 1.3em;
            color: #1e3c72;
            margin-top: 5px;
        }

        .route-arrow {
            font-size: 1.5em;
            margin: 0 10px;
            color: #64748b;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .flights-container {
                grid-template-columns: 1fr;
            }

            .callsign {
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✈️ ITQ Plane Spotter</h1>
            <div class="location-info">
                <strong>Düsseldorf Airport (EDDL)</strong><br>
                Viewing from: Wanheimer Str. 43, 40472 Düsseldorf (Looking North)
            </div>
        </header>

        <div class="status" id="status">
            <span class="loading">Loading flight data...</span>
        </div>

        <div class="map-container">
            <div class="map-title">Your Viewing Area (Looking North)</div>
            <canvas id="viewing-map"></canvas>
        </div>

        <div class="flights-container" id="flights-container">
        </div>

        <div class="footer">
            <div class="last-update" id="last-update">Waiting for data...</div>
            <div style="margin-top: 10px; opacity: 0.7; font-size: 0.9em;">
                Position data: OpenSky Network (every 15 sec) | Flight details: Düsseldorf Airport (every 2 min)
            </div>
        </div>
    </div>

    <script>
        // Düsseldorf Airport coordinates
        const DUS_LAT = 51.2850;  // Same height as office
        const DUS_LON = 6.7568;

        // Your office coordinates (Wanheimer Str. 43, 40472 Düsseldorf)
        const OFFICE_LAT = 51.2850;  // Same height as airport
        const OFFICE_LON = 6.7891;

        // Viewing angle from office (looking north: 315° to 45° = NW to NE)
        const VIEW_BEARING_MIN = 315;
        const VIEW_BEARING_MAX = 45;

        // Runway orientation (EDDL runways: 05L/23R and 05R/23L)
        // Runway 05 = northeast departure (heading ~050°)
        // Runway 23 = southwest landing (approaching from NE, heading ~230° on final)
        const RUNWAY_NE_HEADING = 50; // Runway 05 departure heading
        const RUNWAY_SW_HEADING = 230; // Runway 23 approach heading

        let lastUpdate = null;
        let lastFlightsData = []; // Cache last successful flight data
        let flightDetailsCache = {}; // Cache for enriched flight details
        let lastDetailsFetch = 0; // Track when we last fetched details
        let dusArrivals = []; // Store DUS arrivals separately for time-based matching
        let dusDepartures = []; // Store DUS departures separately for time-based matching

        // Calculate distance between two points (Haversine formula)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                     Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                     Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Calculate bearing from office to plane
        function calculateBearing(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                     Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
            const bearing = Math.atan2(y, x) * 180 / Math.PI;
            return (bearing + 360) % 360;
        }

        // Get direction from bearing
        function getDirection(bearing) {
            const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
            const index = Math.round(bearing / 22.5) % 16;
            return directions[index];
        }

        // Check if bearing is within viewing angle (looking north)
        function isInViewingAngle(bearing) {
            // North view: 315° to 45° (wraps around 0°/360°)
            if (VIEW_BEARING_MIN > VIEW_BEARING_MAX) {
                return bearing >= VIEW_BEARING_MIN || bearing <= VIEW_BEARING_MAX;
            }
            return bearing >= VIEW_BEARING_MIN && bearing <= VIEW_BEARING_MAX;
        }

        // Check if plane is using northeast runway operations (visible from office)
        function isUsingNortheastRunway(heading, altitude, verticalRate, distanceToAirport) {
            // Only consider planes near the airport (within 10km and below 5000m)
            if (distanceToAirport > 10 || altitude > 5000) {
                return false;
            }

            // Normalize heading
            const normalizedHeading = ((heading % 360) + 360) % 360;

            // Departing on runway 05 (heading northeast: 010-100° - wider range)
            const isDepartingNE = (normalizedHeading >= 10 && normalizedHeading <= 100) &&
                                  verticalRate >= -2 && altitude < 3500;

            // Arriving on runway 23 (approaching from NE, heading ~190-270° - wider range)
            const isArrivingFromNE = (normalizedHeading >= 190 && normalizedHeading <= 270) &&
                                     verticalRate <= 2 && altitude < 3500;

            return isDepartingNE || isArrivingFromNE;
        }

        // Determine flight status based on vertical rate and heading
        function determineFlightStatus(heading, altitude, verticalRate, distanceToAirport) {
            const normalizedHeading = ((heading % 360) + 360) % 360;

            // If heading southwest (on approach), it's arriving
            if (normalizedHeading >= 200 && normalizedHeading <= 260 && verticalRate < 0) {
                return 'arriving';
            }

            // If heading northeast (departing), it's departing
            if (normalizedHeading >= 20 && normalizedHeading <= 80 && verticalRate >= -5) {
                return 'departing';
            }

            // Fallback: use vertical rate
            return verticalRate < -2 ? 'arriving' : 'departing';
        }

        // Format altitude
        function formatAltitude(meters) {
            if (!meters && meters !== 0) return 'N/A';
            const feet = Math.round(meters * 3.28084);
            return `${meters.toFixed(0)}m (${feet}ft)`;
        }

        // Format speed
        function formatSpeed(metersPerSecond) {
            if (!metersPerSecond && metersPerSecond !== 0) return 'N/A';
            const kmh = metersPerSecond * 3.6;
            const knots = metersPerSecond * 1.94384;
            return `${kmh.toFixed(0)} km/h (${knots.toFixed(0)} kt)`;
        }

        // Format vertical rate
        function formatVerticalRate(rate) {
            if (!rate && rate !== 0) return 'Level';
            const fpm = rate * 196.85; // m/s to ft/min
            const direction = rate > 0 ? '↑' : '↓';
            return `${direction} ${Math.abs(fpm).toFixed(0)} ft/min`;
        }


        // Fetch flights from OpenSky Network API (supports CORS)
        async function fetchFlights() {
            try {
                const minLat = DUS_LAT - 0.5;
                const maxLat = DUS_LAT + 0.5;
                const minLon = DUS_LON - 0.7;
                const maxLon = DUS_LON + 0.7;

                const url = `https://opensky-network.org/api/states/all?lamin=${minLat}&lomin=${minLon}&lamax=${maxLat}&lomax=${maxLon}`;

                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                lastUpdate = new Date();

                // Convert OpenSky format to our format
                const flights = [];
                if (data.states) {
                    for (const state of data.states) {
                        // OpenSky format: [icao24, callsign, origin_country, time_position, last_contact,
                        //                  longitude, latitude, baro_altitude, on_ground, velocity,
                        //                  true_track, vertical_rate, sensors, geo_altitude, squawk, sps, position_source]
                        const [icao24, callsign, origin_country, time_position, last_contact,
                               longitude, latitude, baro_altitude, on_ground, velocity,
                               true_track, vertical_rate] = state;

                        // Skip if on ground or missing critical data
                        if (on_ground || !latitude || !longitude || !true_track) continue;

                        flights.push({
                            id: icao24,
                            latitude: latitude,
                            longitude: longitude,
                            heading: true_track,
                            altitude: baro_altitude || 0,
                            speed: velocity || 0,
                            verticalRate: vertical_rate || 0,
                            callsign: callsign ? callsign.trim() : icao24.toUpperCase(),
                            origin: '',
                            destination: '',
                            aircraftType: '',
                            registration: icao24
                        });
                    }
                }

                // Cache successful data
                lastFlightsData = flights;
                console.log(`Fetched ${flights.length} flights from OpenSky Network`);
                return flights;
            } catch (error) {
                console.error('Error fetching flights:', error);

                // If we hit rate limits, use cached data
                if (error.message.includes('429') && lastFlightsData.length > 0) {
                    console.log('Using cached flight data due to rate limiting');
                    document.getElementById('status').innerHTML = `<span style="color: #ffa500;">Using cached data (API rate limited)</span>`;
                    return lastFlightsData;
                }

                document.getElementById('status').innerHTML = `<span style="color: #ff6b6b;">Error loading flight data. Retrying in 15 seconds...</span>`;
                return lastFlightsData.length > 0 ? lastFlightsData : [];
            }
        }

        // Draw map showing viewing area
        function drawMap(flights) {
            const canvas = document.getElementById('viewing-map');
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;

            // Set canvas size
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            const width = rect.width;
            const height = rect.height;

            // Clear canvas
            ctx.fillStyle = '#f0f9ff';
            ctx.fillRect(0, 0, width, height);

            // Map scale (10km view)
            const kmPerPixel = 10 / Math.min(width, height) * 1.2;

            // Center on office
            const centerX = width / 2;
            const centerY = height / 2;

            // Draw viewing cone (north-facing)
            ctx.fillStyle = 'rgba(34, 197, 94, 0.1)';
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            const radius = Math.min(width, height) * 0.6;
            ctx.arc(centerX, centerY, radius, -135 * Math.PI / 180, -45 * Math.PI / 180);
            ctx.closePath();
            ctx.fill();

            // Draw viewing cone borders
            ctx.strokeStyle = 'rgba(34, 197, 94, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(centerX - radius * Math.cos(45 * Math.PI / 180), centerY - radius * Math.sin(45 * Math.PI / 180));
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(centerX + radius * Math.cos(45 * Math.PI / 180), centerY - radius * Math.sin(45 * Math.PI / 180));
            ctx.stroke();

            // Draw distance rings (only 10km now)
            ctx.strokeStyle = 'rgba(100, 116, 139, 0.2)';
            ctx.lineWidth = 1;
            [5, 10].forEach((km, i) => {
                const r = km / kmPerPixel;
                ctx.beginPath();
                ctx.arc(centerX, centerY, r, 0, 2 * Math.PI);
                ctx.stroke();
                ctx.fillStyle = '#64748b';
                ctx.font = '10px sans-serif';
                ctx.fillText(km + 'km', centerX + 5, centerY - r + 15);
            });

            // Draw office location
            ctx.fillStyle = '#1e3c72';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 8, 0, 2 * Math.PI);
            ctx.fill();
            ctx.fillStyle = '#1e3c72';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText('ITQ Office', centerX + 12, centerY + 4);

            // Draw airport
            const airportDist = calculateDistance(OFFICE_LAT, OFFICE_LON, DUS_LAT, DUS_LON);
            const airportBearing = calculateBearing(OFFICE_LAT, OFFICE_LON, DUS_LAT, DUS_LON);
            const airportAngle = (airportBearing - 90) * Math.PI / 180;
            const airportR = airportDist / kmPerPixel;
            const airportX = centerX + airportR * Math.cos(airportAngle);
            const airportY = centerY + airportR * Math.sin(airportAngle);

            // Debug: log airport position
            console.log(`Airport: ${airportDist.toFixed(1)}km at bearing ${airportBearing.toFixed(0)}° (${getDirection(airportBearing)})`);

            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.arc(airportX, airportY, 6, 0, 2 * Math.PI);
            ctx.fill();
            ctx.fillStyle = '#f59e0b';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText('EDDL', airportX - 10, airportY + 4);
            ctx.textAlign = 'left'; // Reset for other text

            // Draw planes
            flights.forEach(flight => {
                const dist = flight.distanceFromOffice;
                const bearing = flight.bearing;
                const angle = (bearing - 90) * Math.PI / 180;
                const r = dist / kmPerPixel;
                const x = centerX + r * Math.cos(angle);
                const y = centerY + r * Math.sin(angle);

                // Only draw if within canvas
                if (x >= 0 && x <= width && y >= 0 && y <= height) {
                    ctx.fillStyle = flight.status === 'arriving' ? '#22c55e' : '#f59e0b';
                    ctx.beginPath();
                    // Draw plane as triangle pointing in heading direction
                    // North = 0°, subtract 90 to rotate because canvas 0° is east
                    const headingRad = (flight.true_track) * Math.PI / 180;
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(headingRad);
                    // Triangle points upward (in direction of rotation)
                    ctx.moveTo(0, -7);      // Nose
                    ctx.lineTo(-5, 5);       // Left wing
                    ctx.lineTo(5, 5);        // Right wing
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }
            });

            // Draw compass
            ctx.fillStyle = '#1e3c72';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('N', centerX, 30);
        }

        // Fetch enriched flight details from Düsseldorf Airport API via CORS proxy
        async function fetchFlightDetails() {
            const enrichedFlights = {};

            try {
                // DUS Airport API URLs
                const arrivalUrl = 'https://www.dus.com/api/sitecore/flightapi/SearchFlightsWithOutParams?lang=en&arrival=true&offset=0&codeshare=true&showDetails=false';
                const departureUrl = 'https://www.dus.com/api/sitecore/flightapi/SearchFlightsWithOutParams?lang=en&arrival=false&offset=0&codeshare=true&showDetails=false';

                console.log('Fetching DUS Airport data via CORS proxy...');

                // Try corsproxy.io which should forward headers
                const proxyUrl = 'https://corsproxy.io/?';

                // Fetch arrivals
                try {
                    const fullArrivalUrl = proxyUrl + encodeURIComponent(arrivalUrl);
                    console.log('Fetching arrivals from:', fullArrivalUrl);

                    const arrivalsResponse = await fetch(fullArrivalUrl, {
                        method: 'GET',
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });

                    console.log('Arrivals response status:', arrivalsResponse.status);
                    const responseText = await arrivalsResponse.text();
                    console.log('Arrivals response preview:', responseText.substring(0, 200));

                    if (arrivalsResponse.ok && responseText && !responseText.startsWith('Bad Request')) {
                        const arrivalsData = JSON.parse(responseText);
                        const arrivals = arrivalsData.data?.flights || arrivalsData.Flights || arrivalsData.flights || [];

                        console.log(`Found ${arrivals.length} arrivals in DUS API response`);
                        if (arrivals.length > 0) {
                            console.log('Sample arrival:', JSON.stringify(arrivals[0]));
                        }

                        // Store arrivals for time-based matching
                        dusArrivals = arrivals.map(flight => {
                            const flightNumber = flight.flightNumber || '';
                            const airlineName = flight.airline?.name || '';

                            // Get full city name and country
                            const originCity = flight.destination?.city?.name || flight.destination?.name || '';
                            const originCountry = flight.destination?.city?.country?.name || '';
                            const originIata = flight.destination?.iataCode || '';

                            // Format: "City, Country" or fallback to IATA if city unknown
                            let originFull = originCity;
                            if (originCity && originCountry) {
                                originFull = `${originCity}, ${originCountry}`;
                            } else if (!originCity && originIata) {
                                originFull = originIata;
                            }

                            // Parse times (estimated > actual > scheduled)
                            const timeStr = flight.actualTime || flight.estimatedTime || flight.scheduledTime;
                            const time = timeStr ? new Date(timeStr) : null;

                            return {
                                flightNumber: flightNumber.trim(),
                                origin: originFull,
                                destination: 'Düsseldorf, Germany',
                                airline: airlineName,
                                time: time,
                                timeStr: timeStr
                            };
                        }).filter(f => f.flightNumber && f.time);
                        console.log(`Fetched ${arrivals.length} arrivals from DUS Airport`);
                    } else {
                        console.log('Arrivals request failed or returned bad data');
                    }
                } catch (err) {
                    console.error('Error fetching arrivals:', err);
                }

                // Fetch departures
                try {
                    const fullDepartureUrl = proxyUrl + encodeURIComponent(departureUrl);
                    console.log('Fetching departures from:', fullDepartureUrl);

                    const departuresResponse = await fetch(fullDepartureUrl, {
                        method: 'GET',
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });

                    console.log('Departures response status:', departuresResponse.status);
                    const responseText = await departuresResponse.text();
                    console.log('Departures response preview:', responseText.substring(0, 200));

                    if (departuresResponse.ok && responseText && !responseText.startsWith('Bad Request')) {
                        const departuresData = JSON.parse(responseText);
                        const departures = departuresData.data?.flights || departuresData.Flights || departuresData.flights || [];

                        console.log(`Found ${departures.length} departures in DUS API response`);
                        if (departures.length > 0) {
                            console.log('Sample departure:', JSON.stringify(departures[0]));
                        }

                        // Store departures for time-based matching
                        dusDepartures = departures.map(flight => {
                            const flightNumber = flight.flightNumber || '';
                            const airlineName = flight.airline?.name || '';

                            // Get full city name and country
                            const destCity = flight.destination?.city?.name || flight.destination?.name || '';
                            const destCountry = flight.destination?.city?.country?.name || '';
                            const destIata = flight.destination?.iataCode || '';

                            // Format: "City, Country" or fallback to IATA if city unknown
                            let destFull = destCity;
                            if (destCity && destCountry) {
                                destFull = `${destCity}, ${destCountry}`;
                            } else if (!destCity && destIata) {
                                destFull = destIata;
                            }

                            // Parse times (estimated > actual > scheduled)
                            const timeStr = flight.actualTime || flight.estimatedTime || flight.scheduledTime;
                            const time = timeStr ? new Date(timeStr) : null;

                            return {
                                flightNumber: flightNumber.trim(),
                                origin: 'Düsseldorf, Germany',
                                destination: destFull,
                                airline: airlineName,
                                time: time,
                                timeStr: timeStr
                            };
                        }).filter(f => f.flightNumber && f.time);
                        console.log(`Fetched ${departures.length} departures from DUS Airport`);
                    } else {
                        console.log('Departures request failed or returned bad data');
                    }
                } catch (err) {
                    console.error('Error fetching departures:', err);
                }

                console.log(`Stored ${dusArrivals.length} arrivals and ${dusDepartures.length} departures for time-based matching`);
                return enrichedFlights;
            } catch (error) {
                console.error('Error fetching DUS Airport data:', error);
                return enrichedFlights;
            }
        }

        // Match flight by time (more reliable than callsign matching)
        function matchFlightByTime(status, distanceToAirport) {
            const now = new Date();
            const timeWindow = 30 * 60 * 1000; // 30 minutes in milliseconds

            // Choose the right list based on arrival/departure
            const flightList = status === 'arriving' ? dusArrivals : dusDepartures;

            // Find flights within time window
            const candidates = flightList.filter(f => {
                const timeDiff = Math.abs(f.time - now);
                return timeDiff <= timeWindow;
            });

            if (candidates.length === 0) return null;

            // Sort by time proximity (closest to now)
            candidates.sort((a, b) => Math.abs(a.time - now) - Math.abs(b.time - now));

            // Return the closest match
            const match = candidates[0];
            const minutesAway = Math.round((match.time - now) / 60000);
            console.log(`Time-matched ${status} flight: ${match.flightNumber} (${match.airline}) ${minutesAway > 0 ? 'in ' + minutesAway + ' min' : Math.abs(minutesAway) + ' min ago'}`);

            return match;
        }

        // Extract airline name from callsign or flight number
        function extractAirlineName(callsign, flightNumber) {
            const airlines = {
                'DLH': 'Lufthansa',
                'EWG': 'Eurowings',
                'EW': 'Eurowings',
                'RYR': 'Ryanair',
                'FR': 'Ryanair',
                'EZY': 'easyJet',
                'U2': 'easyJet',
                'BAW': 'British Airways',
                'BA': 'British Airways',
                'AFR': 'Air France',
                'AF': 'Air France',
                'KLM': 'KLM',
                'AUA': 'Austrian Airlines',
                'OS': 'Austrian Airlines',
                'SWR': 'Swiss',
                'LX': 'Swiss',
                'TAP': 'TAP Portugal',
                'TP': 'TAP Portugal',
                'IBE': 'Iberia',
                'IB': 'Iberia',
                'AEE': 'Aegean Airlines',
                'A3': 'Aegean Airlines',
                'SAS': 'SAS',
                'SK': 'SAS',
                'FIN': 'Finnair',
                'AY': 'Finnair',
                'THY': 'Turkish Airlines',
                'TK': 'Turkish Airlines',
                'UAE': 'Emirates',
                'EK': 'Emirates',
                'ETD': 'Etihad',
                'EY': 'Etihad',
                'QTR': 'Qatar Airways',
                'QR': 'Qatar Airways',
                'AIC': 'Air India',
                'AI': 'Air India',
                'UAL': 'United Airlines',
                'UA': 'United Airlines',
                'AAL': 'American Airlines',
                'AA': 'American Airlines',
                'DAL': 'Delta Air Lines',
                'DL': 'Delta Air Lines',
                'WZZ': 'Wizz Air',
                'W6': 'Wizz Air',
                'VLG': 'Vueling',
                'VY': 'Vueling',
                'BER': 'Air Berlin',
                'AB': 'Air Berlin',
                'EIN': 'Aer Lingus',
                'EI': 'Aer Lingus',
                'NAX': 'Norwegian',
                'DY': 'Norwegian',
                'SWN': 'Sunwing',
                'WG': 'Sunwing',
                'CLH': 'Lufthansa Cargo',
                'GEC': 'Lufthansa Cargo',
                'BCS': 'European Air Transport',
                'QY': 'European Air Transport',
                'CFG': 'Condor',
                'DE': 'Condor',
                'TUI': 'TUI',
                'X3': 'TUI',
                'BEE': 'FlyBe',
                'BE': 'FlyBe',
                'LOG': 'Loganair',
                'LM': 'Loganair',
                'AIB': 'Avanti Air'
            };

            // Try to match the first 2-3 characters of the callsign
            const code = callsign.substring(0, 3).toUpperCase();
            if (airlines[code]) return airlines[code];

            const code2 = callsign.substring(0, 2).toUpperCase();
            if (airlines[code2]) return airlines[code2];

            // Try from flight number
            if (flightNumber) {
                const fnCode = flightNumber.substring(0, 2).toUpperCase();
                if (airlines[fnCode]) return airlines[fnCode];
            }

            return '';
        }

        // Display flights
        function displayFlights(flights) {
            const container = document.getElementById('flights-container');

            if (!flights || flights.length === 0) {
                container.innerHTML = `
                    <div class="no-flights">
                        <div class="plane-icon">🔍</div>
                        <div>No flights visible in your viewing area</div>
                        <div style="font-size: 0.8em; margin-top: 15px; opacity: 0.7;">
                            Looking north from ITQ office...
                        </div>
                    </div>
                `;
                document.getElementById('status').innerHTML = `<span>No visible flights</span>`;
                drawMap([]);
                return;
            }

            // Process and filter flights
            const processedFlights = flights.map(flight => {
                const distanceFromOffice = calculateDistance(OFFICE_LAT, OFFICE_LON, flight.latitude, flight.longitude);
                const distanceToAirport = calculateDistance(flight.latitude, flight.longitude, DUS_LAT, DUS_LON);
                const bearing = calculateBearing(OFFICE_LAT, OFFICE_LON, flight.latitude, flight.longitude);
                const direction = getDirection(bearing);
                const status = determineFlightStatus(flight.heading, flight.altitude, flight.verticalRate, distanceToAirport);

                // Match with DUS Airport data by time (more reliable than callsign)
                const details = matchFlightByTime(status, distanceToAirport) || {};

                return {
                    ...flight,
                    distanceFromOffice,
                    distanceToAirport,
                    bearing,
                    direction,
                    status,
                    true_track: flight.heading,
                    // Enriched data from DUS airport (time-matched) or fallback to OpenSky
                    flightNumber: details.flightNumber || flight.callsign,
                    originAirport: details.origin || '',
                    destinationAirport: details.destination || '',
                    airline: details.airline || '',
                    // Keep registration/ID as aircraft identifier since DUS doesn't provide type
                    aircraftModel: flight.registration || flight.id || '',
                    aircraftTypeCode: flight.registration || flight.id || ''
                };
            }).filter(f => {
                // Debug logging
                const inView = isInViewingAngle(f.bearing);
                const usingNERunway = isUsingNortheastRunway(f.heading, f.altitude, f.verticalRate, f.distanceToAirport);

                if (f.distanceToAirport < 15) {
                    console.log(`Flight ${f.callsign}: bearing=${f.bearing.toFixed(0)}° inView=${inView}, heading=${f.heading.toFixed(0)}° alt=${f.altitude.toFixed(0)}m vrate=${f.verticalRate} dist=${f.distanceToAirport.toFixed(1)}km runway=${usingNERunway}`);
                }

                // Must be in viewing angle AND using northeast runway
                return inView && usingNERunway;
            });

            // Sort by distance from office (closest first)
            processedFlights.sort((a, b) => a.distanceFromOffice - b.distanceFromOffice);

            console.log(`After filtering: ${processedFlights.length} flights match criteria`);

            // Count by status
            const arriving = processedFlights.filter(f => f.status === 'arriving').length;
            const departing = processedFlights.filter(f => f.status === 'departing').length;

            document.getElementById('status').innerHTML = `
                <strong>Visible Flights:</strong>
                <span style="color: #22c55e;">Arriving: ${arriving}</span> |
                <span style="color: #f59e0b;">Departing: ${departing}</span>
                <span style="opacity: 0.7; margin-left: 10px;">(${flights.length} total in area)</span>
            `;

            // Display flights
            container.innerHTML = processedFlights.map(flight => {
                let routeDisplay = '';
                if (flight.origin && flight.destination) {
                    routeDisplay = `
                        <div class="route-info">
                            <div class="detail-label">Route</div>
                            <div class="detail-value">
                                ${flight.origin} <span class="route-arrow">→</span> ${flight.destination}
                            </div>
                        </div>
                    `;
                } else if (flight.status === 'arriving' && flight.origin) {
                    routeDisplay = `
                        <div class="route-info">
                            <div class="detail-label">Coming From</div>
                            <div class="detail-value">
                                ${flight.origin}
                            </div>
                        </div>
                    `;
                } else if (flight.status === 'departing' && flight.destination) {
                    routeDisplay = `
                        <div class="route-info">
                            <div class="detail-label">Going To</div>
                            <div class="detail-value">
                                ${flight.destination}
                            </div>
                        </div>
                    `;
                } else {
                    routeDisplay = `
                        <div class="route-info">
                            <div class="detail-label">Route</div>
                            <div class="detail-value" style="font-size: 1.1em;">
                                ${flight.status === 'arriving' ? 'Arriving at Düsseldorf' : 'Departing from Düsseldorf'}
                            </div>
                        </div>
                    `;
                }

                // Format values
                const speedKts = flight.speed ? (flight.speed * 1.94384).toFixed(0) : 'N/A';
                const altitudeFt = flight.altitude ? Math.round(flight.altitude * 3.28084) : 'N/A';
                const distFromAirport = flight.distanceToAirport.toFixed(1);

                // Build route display
                let routeHtml = '';
                if (flight.originAirport && flight.destinationAirport) {
                    routeHtml = `
                        <div class="route-info">
                            <div class="detail-label">Route</div>
                            <div class="detail-value">
                                ${flight.originAirport} <span class="route-arrow">→</span> ${flight.destinationAirport}
                            </div>
                        </div>
                    `;
                } else if (flight.status === 'arriving' && flight.originAirport) {
                    routeHtml = `
                        <div class="route-info">
                            <div class="detail-label">From</div>
                            <div class="detail-value">${flight.originAirport} → EDDL</div>
                        </div>
                    `;
                } else if (flight.status === 'departing' && flight.destinationAirport) {
                    routeHtml = `
                        <div class="route-info">
                            <div class="detail-label">To</div>
                            <div class="detail-value">EDDL → ${flight.destinationAirport}</div>
                        </div>
                    `;
                } else {
                    routeHtml = `
                        <div class="route-info">
                            <div class="detail-label">${flight.status === 'arriving' ? 'Inbound to' : 'Outbound from'}</div>
                            <div class="detail-value">Düsseldorf (EDDL)</div>
                        </div>
                    `;
                }

                // Build aircraft info display
                const aircraftInfo = flight.aircraftTypeCode || flight.aircraftModel || flight.registration || flight.id;
                const airlineInfo = flight.airline ? `<div style="font-size: 0.9em; opacity: 0.8; margin-top: 3px;">${flight.airline}</div>` : '';

                return `
                    <div class="flight-card ${flight.status}">
                        <div class="flight-header">
                            <div>
                                <div class="callsign">${flight.flightNumber}</div>
                                ${airlineInfo}
                            </div>
                            <div class="status-badge ${flight.status}">${flight.status}</div>
                        </div>
                        <div class="flight-details">
                            <div class="detail-item" style="grid-column: span 2;">
                                <div class="detail-label">Aircraft</div>
                                <div class="detail-value">${aircraftInfo}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Altitude</div>
                                <div class="detail-value">${altitudeFt} ft</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Speed</div>
                                <div class="detail-value">${speedKts} kt</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Heading</div>
                                <div class="detail-value">${flight.true_track ? flight.true_track.toFixed(0) + '°' : 'N/A'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Vertical Rate</div>
                                <div class="detail-value">${formatVerticalRate(flight.verticalRate)}</div>
                            </div>
                            ${routeHtml}
                            <div class="distance-info">
                                <div class="detail-label">Distance</div>
                                <div class="detail-value">
                                    ${distFromAirport} km from airport, ${flight.distanceFromOffice.toFixed(1)} km ${flight.direction} from you
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Update last update time
            document.getElementById('last-update').textContent = `Last updated: ${lastUpdate.toLocaleTimeString()}`;

            // Draw map with visible flights
            drawMap(processedFlights);
        }

        // Update flights
        async function updateFlights() {
            const flights = await fetchFlights();
            displayFlights(flights);
        }

        // Update flight details cache
        async function updateFlightDetailsCache() {
            const now = Date.now();
            // Only fetch if it's been more than 2 minutes since last fetch
            if (now - lastDetailsFetch > 120000 || lastDetailsFetch === 0) {
                const details = await fetchFlightDetails();

                // Merge with existing cache - store by callsign for easy lookup
                for (const [callsign, info] of Object.entries(details)) {
                    flightDetailsCache[callsign] = info;
                }

                lastDetailsFetch = now;
                console.log(`Flight details updated: ${dusArrivals.length} arrivals, ${dusDepartures.length} departures from DUS Airport`);
            }
        }

        // Initial load - start with basic flight data
        updateFlights();

        // Fetch DUS Airport enriched data immediately
        updateFlightDetailsCache();

        // Refresh flights every 15 seconds (reduced to avoid rate limits)
        setInterval(updateFlights, 15000);

        // Refresh flight details every 2 minutes (DUS Airport data)
        setInterval(updateFlightDetailsCache, 120000);
    </script>
